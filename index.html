  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ss=\"guide-section-head\">\n        <div class=\"step-badge\">1<\u002Fdiv>\n        <h2>Cấu trúc báo cáo<\u002Fh2>\n      <\u002Fdiv>\n      <p>Báo cáo gồm <b>2 trang chính<\u002Fb> phục vụ 2 mục đích khác nhau:<\u002Fp>\n      <ul>\n        <li><b>📊 Overview Material<\u002Fb> — Tổng quan khối lượng vật tư theo từng dự án (đã đặt hàng, đã về kho, còn thiếu).<\u002Fli>\n        <li><b>📦 Material Status<\u002Fb> — Truy vết chi tiết theo 3 góc nhìn: Nhà cung cấp / Số MPR / Loại vật tư.<\u002Fli>\n      <\u002Ful>\n      <div class=\"tip\">💡 Thứ tự đọc gợi ý: mở <b>Overview Material<\u002Fb> trước để nắm cục diện chung → nếu thấy dự án có vấn đề, chuyển qua <b>Material Status<\u002Fb> để tìm nguyên nhân cụ thể.<\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- SECTION 2 -->\n    <section class=\"guide-section\" id=\"s2\">\n      <div class=\"guide-section-head\">\n        <div class=\"step-badge\">2<\u002Fdiv>\n        <h2>Chuyển giữa các trang<\u002Fh2>\n      <\u002Fdiv>\n      <p>Click vào <b>tab trên cùng<\u002Fb> để chuyển trang. Tab đang chọn có gạch chân màu xanh.<\u002Fp>\n\n      <div class=\"mock\">\n        <span class=\"mock-label\">Thanh điều hướng<\u002Fspan>\n        <div class=\"mock-nav\">\n          <div class=\"mock-nav-item active\">📊 Overview Material<\u002Fdiv>\n          <div class=\"mock-nav-item highlight\">📦 Material Status<\u002Fdiv>\n          <div class=\"mock-nav-item\">📖 Hướng dẫn sử dụng<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:12px;\"><span class=\"callout\">Click để chuyển sang trang Material Status<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- SECTION 3 -->\n    <section class=\"guide-section\" id=\"s3\">\n      <div class=\"guide-section-head\">\n        <div class=\"step-badge\">3<\u002Fdiv>\n        <h2>Bộ lọc dự án — quan trọng nhất<\u002Fh2>\n      <\u002Fdiv>\n      <p>Đây là bộ lọc <b>toàn cục<\u002Fb>: chọn 1 dự án thì <b>tất cả<\u002Fb> KPI, biểu đồ và bảng trên trang đều tự động lọc lại theo dự án đó.<\u002Fp>\n\n      <div class=\"mock\">\n        <span class=\"mock-label\">Bước 1 — Click vào dropdown<\u002Fspan>\n        <div class=\"mock-filter\">\n          <span style=\"font-size:13px; font-weight:700; color:var(--muted); text-transform:uppercase;\">Dự án<\u002Fspan>\n          <div class=\"mock-input highlight\" style=\"min-width:180px;\">Tất cả dự án ▾<\u002Fdiv>\n          <span style=\"font-size:13px; font-weight:700; color:var(--muted); text-transform:uppercase;\">Từ ngày<\u002Fspan>\n          <div class=\"mock-input\">2026-01-01<\u002Fdiv>\n          <span style=\"font-size:13px; font-weight:700; color:var(--muted); text-transform:uppercase;\">Đến ngày<\u002Fspan>\n          <div class=\"mock-input\">2026-08-19<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"arrow-down\">▼<\u002Fdiv>\n        <span class=\"mock-label\" style=\"left:16px;\">Bước 2 — Chọn dự án cần xem<\u002Fspan>\n        <div class=\"mock-dropdown\">\n          <div class=\"mock-dropdown-item selected\">Tất cả dự án<\u002Fdiv>\n          <div class=\"mock-dropdown-item\">V314 — MARUBENI<\u002Fdiv>\n          <div class=\"mock-dropdown-item\">M304 — JGC<\u002Fdiv>\n          <div class=\"mock-dropdown-item highlight\">U285 — TOYO<\u002Fdiv>\n          <div class=\"mock-dropdown-item\">U315 — TECHNIP<\u002Fdiv>\n          <div class=\"mock-dropdown-item\">… và các dự án khác<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:12px;\"><span class=\"callout\">Chọn 1 dòng — cả trang sẽ lọc theo dự án đó<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"tip\">💡 <b>Sync giữa 2 trang<\u002Fb>: nếu đang ở trang Overview Material chọn V314, khi chuyển sang Material Status thì cũng đang ở V314 luôn. Không cần chọn lại.<\u002Fdiv>\n\n      <p style=\"margin-top:14px;\">Khi đang lọc theo dự án, sẽ thấy <b>chip màu xanh<\u002Fb> hiển thị bên phải cho biết đang xem gì:<\u002Fp>\n      <div class=\"mock\" style=\"padding:12px 20px;\">\n        <div style=\"font-size:14px; color:var(--muted);\">\n          Đang xem: <span class=\"filter-chip\">🎯 V314<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- SECTION 4 -->\n    <section class=\"guide-section\" id=\"s4\">\n      <div class=\"guide-section-head\">\n        <div class=\"step-badge\">4<\u002Fdiv>\n        <h2>Bộ lọc theo ngày<\u002Fh2>\n      <\u002Fdiv>\n      <p>Lọc dữ liệu theo <b>ngày phát hành MPR<\u002Fb> (issue_date). Chỉ những MPR có issue_date nằm trong khoảng [Từ ngày, Đến ngày] mới được tính vào báo cáo.<\u002Fp>\n      <div class=\"mock\" style=\"padding:14px 20px;\">\n        <div class=\"mock-filter\">\n          <span style=\"font-size:13px; font-weight:700; color:var(--muted); text-transform:uppercase;\">Từ ngày<\u002Fspan>\n          <div class=\"mock-input highlight\">2026-01-01<\u002Fdiv>\n          <span style=\"font-size:13px; font-weight:700; color:var(--muted); text-transform:uppercase;\">Đến ngày<\u002Fspan>\n          <div class=\"mock-input highlight\">2026-08-19<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"note\">⚠️ Đơn hàng phát hành ngoài khoảng ngày này sẽ <b>không hiển thị<\u002Fb>, kể cả khi đã về kho. Nếu thấy số liệu thiếu bất thường, kiểm tra lại khoảng ngày trước.<\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- SECTION 5 -->\n    <section class=\"guide-section\" id=\"s5\">\n      <div class=\"guide-section-head\">\n        <div class=\"step-badge\">5<\u002Fdiv>\n        <h2>Tab con trong trang Material Status<\u002Fh2>\n      <\u002Fdiv>\n      <p>Trong trang <b>Material Status<\u002Fb> có 4 tab con — mỗi tab là 1 góc nhìn khác nhau về cùng một tập dữ liệu:<\u002Fp>\n      <ul>\n        <li><b>🏭 Follow Supplier<\u002Fb> — Nhóm theo nhà cung cấp. Trả lời: \"NCC nào đang nợ hàng nhiều nhất?\"<\u002Fli>\n        <li><b>📄 Follow MPR<\u002Fb> — Nhóm theo số MPR. Trả lời: \"MPR nào đang xử lý dở, MPR nào còn chưa mua?\"<\u002Fli>\n        <li><b>🔩 Follow Material Type<\u002Fb> — Nhóm theo loại vật tư (Code + Description). Trả lời: \"Chi bao nhiêu cho từng loại vật tư (USD/VND)?\"<\u002Fli>\n        <li><b>📋 Follow PO<\u002Fb> — Nhóm theo từng PO. Trả lời: \"PO nào còn thiếu hàng nhiều nhất?\"<\u002Fli>\n      <\u002Ful>\n\n      <p><b>Quy tắc trạng thái (áp dụng chung cho cả 4 tab):<\u002Fb><\u002Fp>\n      <ul>\n        <li><span class=\"status-pill badge-success\">Đủ<\u002Fspan> — % Arrived (gồm Inventory) ≥ <b>98%<\u002Fb> so với MPR.<\u002Fli>\n        <li><span class=\"status-pill badge-danger\">Rủi ro<\u002Fspan> — chưa đạt 98% <b>và<\u002Fb> ETA Update gần nhất chỉ còn <b>dưới 15 ngày<\u002Fb> (kể cả đã quá hạn).<\u002Fli>\n        <li><span class=\"status-pill badge-info\">Đang nhập<\u002Fspan> — các trường hợp còn lại.<\u002Fli>\n      <\u002Ful>\n      <p class=\"note\">ETA Update dùng để so sánh là <b>ngày gần nhất<\u002Fb> trong các dòng chưa đủ hàng của NCC / MPR / loại vật tư / PO đó.<\u002Fp>\n\n      <p><b>Trang Logistic<\u002Fb> gồm 2 phần: <b>📥 Nhập NVL<\u002Fb> (lịch về Amecc, tổng nhập theo NCC, NCC giao chậm so với Plan ETA Update) và <b>📤 Xuất NVL<\u002Fb> (khối lượng theo tháng/ETD, theo dự án, theo nguyên vật liệu, theo Export type, theo cảng xuất POL và theo điều kiện giao hàng — tất cả quy về <b>Tấn<\u002Fb>; lô \"Muộn\" = đã quá ETA mà chưa hoàn tất). Bảng chi tiết cuối trang có nút chuyển giữa <b>Chi tiết nhập<\u002Fb> và <b>Chi tiết xuất<\u002Fb>.<\u002Fp>\n\n      <div class=\"mock\">\n        <span class=\"mock-label\">Sub-tabs bên trong Material Status<\u002Fspan>\n        <div class=\"mock-nav\" style=\"background:#fafbfc;\">\n          <div class=\"mock-nav-item active\">🏭 Follow Supplier<\u002Fdiv>\n          <div class=\"mock-nav-item highlight\">📄 Follow MPR<\u002Fdiv>\n          <div class=\"mock-nav-item\">🔩 Follow Material Type<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:12px;\"><span class=\"callout\">Click để chuyển góc nhìn<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- =================== PAGE 4: LOGISTIC =================== -->\n<div class=\"page\" id=\"page-logistic\">\n\n  <div class=\"page-header\">\n    <div class=\"page-eyebrow\">TRANG 4 — VẬN CHUYỂN VÀ THÔNG QUAN<\u002Fdiv>\n    <div class=\"page-title\">Logistic<\u002Fdiv>\n    <div class=\"page-desc\">Hai phần: <b>Nhập NVL<\u002Fb> (shipment về Amecc — cảnh báo quá hạn storage, hàng sắp về, NCC giao chậm) và <b>Delivery<\u002Fb> (giao hàng / xuất khẩu thành phẩm — khối lượng, cảng xuất, tiến độ).<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"filter-bar\">\n    <div class=\"filter-group\">\n      <span class=\"filter-label\">Dự án<\u002Fspan>\n      <select class=\"filter-input proj-slicer\">\n        <option value=\"ALL\">Tất cả dự án<\u002Foption>\n      <\u002Fselect>\n    <\u002Fdiv>\n    <div class=\"filter-group\">\n      <span class=\"filter-label\">Từ ngày<\u002Fspan>\n      <input type=\"date\" class=\"filter-input\" id=\"lg-date-from\">\n    <\u002Fdiv>\n    <div class=\"filter-group\">\n      <span class=\"filter-label\">Đến ngày<\u002Fspan>\n      <input type=\"date\" class=\"filter-input\" id=\"lg-date-to\">\n    <\u002Fdiv>\n    <div class=\"filter-badge\" id=\"lg-filter-badge\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"content\">\n\n    <div class=\"section-head\">📥 Nhập NVL <span class=\"sh-desc\">Shipment từ NCC về kho Amecc<\u002Fspan><\u002Fdiv>\n\n    <!-- KPI: 5 chỉ số trên cùng 1 hàng -->\n    <div class=\"metrics-grid kpi-row-5\" id=\"lg-kpis-pipeline\"><\u002Fdiv>\n\n    <!-- Chart: Timeline 30 days arrival -->\n    <div class=\"card\" style=\"margin-top:20px;\">\n      <div class=\"card-header\">\n        <div>\n          <div class=\"card-title\">Lịch dự kiến về Amecc — 30 ngày tới<\u002Fdiv>\n          <div class=\"card-sub\">Tổng KL (Tấn) plan arrival theo ngày · Cột đỏ = shipment quá hạn (chưa arrival Amecc mặc dù plan đã qua)<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n e=\"margin:0;\">\n        <div class=\"card-header\">\n          <div>\n            <div class=\"card-title\">Khối lượng theo Export type<\u002Fdiv>\n            <div class=\"card-sub\">Tấn theo mã Export type · nhãn kèm % · tự chuyển thang log khi chênh lệch quá lớn<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"card-body\">\n          <div class=\"hbar-container\"><div class=\"hbar-body-wrap\"><div class=\"hbar-inner\"><canvas id=\"chart-ex-type\"><\u002Fcanvas><\u002Fdiv><\u002Fdiv><div class=\"hbar-axis-wrap\" id=\"chart-ex-type-axis\"><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"grid-2-8-4\" style=\"margin-top:20px;\">\n      <div class=\"card\" style=\"margin:0;\">\n        <div class=\"card-header\">\n          <div>\n            <div class=\"card-title\">Khối lượng theo cảng xuất (POL)<\u002Fdiv>\n            <div class=\"card-sub\">Tấn theo cảng bốc hàng · chỉ lô đã có GW — tooltip kèm container &amp; số lô<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"card-body\">\n          <div class=\"hbar-container\"><div class=\"hbar-body-wrap\"><div class=\"hbar-inner\"><canvas id=\"chart-ex-pol\"><\u002Fcanvas><\u002Fdiv><\u002Fdiv><div class=\"hbar-axis-wrap\" id=\"chart-ex-pol-axis\"><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"card\" style=\"margin:0;\">\n        <div class=\"card-header\">\n          <div>\n            <div class=\"card-title\">Điều kiện giao hàng<\u002Fdiv>\n            <div class=\"card-sub\">Tấn theo Delivery term · chỉ lô đã có GW<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"card-body\">\n          <div style=\"position:relative; height:300px;\"><canvas id=\"chart-ex-dlv\"><\u002Fcanvas><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- ===================== BẢNG CHI TIẾT ===================== -->\n    <div class=\"card\" style Số nguyên → không thập phân; số có thập phân → luôn 2 số sau dấu phẩy\nconst fmt = (n) => {\n  if (n == null) return '—';\n  const num = Number(n);\n  if (Number.isInteger(num)) return num.toLocaleString('vi-VN');\n  return num.toLocaleString('vi-VN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });\n};\nconst fmt1 = fmt;\n// Compact for chart labels (M/K), cùng logic 2 số thập phân khi có decimal\nconst fmtC = (n) => {\n  if (n == null || n === 0) return '';\n  const format = (v) => {\n    const num = Number(v);\n    if (Number.isInteger(num)) return num.toLocaleString('vi-VN');\n    return num.toLocaleString('vi-VN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });\n  };\n  const abs = Math.abs(n);\n  if (abs >= 1e6) return format(n/1e6) + 'M';\n  if (abs >= 1e3) return format(n/1e3) + 'K';\n  return format(n);\n};\n\n/* =============== CHART DEFAULTS + DATALABELS =============== */\nif (typeof ChartDataLabels !== 'undefined') {\n  Chart.register(ChartDataLabels);\n  Chart.defaults.set('plugins.datalabels', {\n    color: '#1d273b',\n    font: { size: 14, weight: '700' },\n    formatter: (v) => {\n      if (v == null || v === 0 || Array.isArray(v)) return '';\n      return fmtC(v);\n    },\n    anchor: 'end',\n    align: 'end',\n    offset: 4,\n    clamp: true\n  });\n}\n\n/* ---- Ngày hệ thống (giả lập khớp kỳ báo cáo) ---- */\nconst TODAY = new Date('2026-08-28');\nconst DAY_MS = 86400000;\nconst parseD = s => (s === '—' || !s) ? null : new Date(s);\nconst daysTo = s => { const d = parseD(s); return d ? Math.round((d - TODAY) / DAY_MS) : null; };\nconst fmtD = s => s || '—';\n\n/* ---- TRẠNG THÁI VẬT TƯ (3 mức) ----\n *  Đủ        : % Arrived >= 98%\n *  Rủi ro    : chưa đủ 98% VÀ ETA Update gần nhất còn < 15 ngày (kể cả đã quá hạn)\n *  Đang nhập : các trường hợp còn lại\n * ------------------------------------ */\nconst STATUS_THRESHOLD = 98;\nconst RISK_DAYS = 15;\nconst ST_COLORS = { 'Đủ': '#2fb344', 'Đang nhập': '#4299e1', 'Rủi ro': '#d63939' };\n\nfunction matStatus(arrRatio, eta) {\n  if (arrRatio >= STATUS_THRESHOLD) return 'Đủ';\n  const d = daysTo(eta);\n  if (d !== null && d < RISK_DAYS) return 'Rủi ro';\n  return 'Đang nhập';\n}\nfunction statusBuckets(rows, ratioFn) {\n  const b = { 'Đủ': 0, 'Đang nhập': 0, 'Rủi ro': 0 };\n  rows.forEach(r => { b[matStatus(ratioFn(r), r.eta)]++; });\n  return b;\n}\nfunction statusDoughnut(canvasId, buckets, unit) {\n  return new Chart(document.getElementById(canvasId), {\n    type: 'doughnut',\n    data: {\n      labels: Object.keys(buckets),\n      datasets: [{ data: Object.values(buckets), backgroundColor: Object.keys(buckets).map(k => ST_COLORS[k]), borderWidth: 2, borderColor: '#fff' }]\n    },\n    options: {\n      responsive: true, maintainAspectRatio: false,\n      plugins: {\n        legend: { position: 'bottom', labels: { font: { size: 14 }, boxWidth: 14, padding: 8 } },\n        datalabels: { color: '#fff', font: { size: 16, weight: '700' }, anchor: 'center', align: 'center', formatter: v => v > 0 ? v : '' },\n        tooltip: { callbacks: { label: c => { const t = c.dataset.data.reduce((a,b)=>a+b,0); const p = t ? (c.raw/t*100).toFixed(2) : 0; return ` ${c.label}: ${c.raw} ${unit} (${p}%)`; } } }\n      },\n      cutout: '58%'\n    }\n  });\n}\n\nfunction pbar(pct) {\n  const w = Math.max(0, Math.min(100, pct));\n  let color = 'var(--success)';\n  if (pct < 50) color = 'var(--danger)';\n  else if (pct < 80) color = 'var(--warning)';\n  return `<div class=\"pbar\"><div class=\"pbar-track\"><div class=\"pbar-fill\" style=\"width:${w}%; background:${color}\"><\u002Fdiv><\u002Fdiv><span class=\"pbar-txt\">${pct.toFixed(2)}%<\u002Fspan><\u002Fdiv>`;\n}\nfunction statusPill(arrRatio, eta) {\n  const st = matStatus(arrRatio, eta);\n  const cls = st === 'Đủ' ? 'badge-success' : (st === 'Rủi ro' ? 'badge-danger' : 'badge-info');\n  const d = daysTo(eta);\n  const hint = (st === 'Rủi ro' && d !== null) ? ` title=\"ETA Update ${fmtD(eta)} · còn ${d} ngày\"` : '';\n  return `<span class=\"status-pill ${cls}\"${hint}>${st}<\u002Fspan>`;\n}\nfunction filterByProj(arr) {\n  return currentProject === 'ALL' ? arr : arr.filter(r => r.proj === currentProject);\n}\nfunction filterSupplier() {\n  let r = filterByProj(supplierData);\n  if (currentSupplier !== 'ALL') r = r.filter(x => x.sup === currentSupplier);\n  return r;\n}\nfunction filterMPR() {\n  let r = filterByProj(mprData);\n  if (currentMprNo !== 'ALL') r = r.filter(x => x.mpr_no === currentMprNo);\n  return r;\n}\nfunction filterMat() {\n  let r = filterByProj(matData);\n  if (currentMatKey !== 'ALL') r = r.filter(x => `${x.code}|${x.desc}` === currentMatKey);\n  return r;\n}\nfunction filterPO() {\n  let r = filterByProj(poData);\n  if (currentPoNo !== 'ALL') r = r.filter(x => x.po_no === currentPoNo);\n  return r;\n}\n\n/* =============== POPULATE SUB-SLICERS =============== */\nfunction populateSubSlicers() {\n  // Supplier\n  const supRows = filterByProj(supplierData);\n  const supSel = document.getElementById('sup-slicer');\n  supSel.innerHTML = '<option value=\"ALL\">Tất cả NCC<\u002Foption>';\n  [...new Set(supRows.map(r => r.sup))].sort().forEach(s => {\n    supSel.insertAdjacentHTML('beforeend', `<option value=\"${s}\">${s}<\u002Foption>`);\n  });\n  currentSupplier = 'ALL';\n\n  // MPR\n  const mprRows = filterByProj(mprData);\n  const mprSel = document.getElementById('mpr-slicer');\n  mprSel.innerHTML = '<option value=\"ALL\">Tất cả MPR<\u002Foption>';\n  [...new Set(mprRows.map(r => r.mpr_no))].sort().forEach(s => {\n    mprSel.insertAdjacentHTML('beforeend', `<option value=\"${s}\">${s}<\u002Foption>`);\n  });\n  currentMprNo = 'ALL';\n\n  // Material Type\n  const matRows = filterByProj(matData);\n  const matSel = document.getElementById('mat-slicer');\n  matSel.innerHTML = '<option value=\"ALL\">Tất cả loại vật tư<\u002Foption>';\n  const seen = new Set();\n  matRows.forEach(r => {\n    const k = `${r.code}|${r.desc}`;\n    if (!seen.has(k)) { seen.add(k); matSel.insertAdjacentHTML('beforeend', `<option value=\"${k}\">${r.code} — ${r.desc}<\u002Foption>`); }\n  });\n  currentMatKey = 'ALL';\n\n  // PO\n  const poRows = filterByProj(poData);\n  const poSel = document.getElementById('po-slicer');\n  poSel.innerHTML = '<option value=\"ALL\">Tất cả PO<\u002Foption>';\n  poRows.forEach(r => {\n    poSel.insertAdjacentHTML('beforeend', `<option value=\"${r.po_no}\">${r.po_no} — ${r.sup}<\u002Foption>`);\n  });\n  currentPoNo = 'ALL';\n}\n\n/* Set dynamic height cho phần body của horizontal bar chart (chỉ bars, không có axis) */\nfunction setHBarHeight(canvasId, count) {\n  const c = document.getElementById(canvasId);\n  if (!c) return;\n  const inner = c.parentElement;\n  if (!inner || !inner.classList.contains('hbar-inner')) return;\n  const h = Math.max(180, count * 52 + 18);   // 52px mỗi thanh (đã tính cỡ chữ lớn hơn)\n  inner.style.height = h + 'px';\n}\n\n/* Đồng bộ chiều cao 2 chart hbar cùng hàng: giới hạn CẢ HAI theo bên NGẮN HƠN (ít dòng hơn) —\n   thêm scroll cho bên còn lại — tránh việc chart ít dòng bị kéo giãn ra rất cao/thưa để khớp bên nhiều dòng. */\nfunction capHBarRowToShorter(canvasId1, canvasId2) {\n  const inner1 = document.getElementById(canvasId1).parentElement;\n  const inner2 = document.getElementById(canvasId2).parentElement;\n  const h1 = parseFloat(inner1.style.height) || 0;\n  const h2 = parseFloat(inner2.style.height) || 0;\n  const cap = Math.min(h1, h2);\n  [inner1, inner2].forEach(inner => {\n    const wrap = inner.parentElement; // .hbar-body-wrap\n    wrap.style.maxHeight = cap + 'px';\n    wrap.style.overflowY = 'auto';\n  });\n}\n\n/* Y-axis width fixed cho body chart để align với axis chart */\nconst HBAR_Y_WIDTH = 170;\n\n/* Rút gọn nhãn trục Y bằng đo pixel thật (canvas measureText) — tránh bị cắt cụt từ bên trái\n   khi text dài hơn HBAR_Y_WIDTH (trước đây afterFit ép width=170 khiến Chart.js vẽ label\n   right-aligned và phần đầu text tràn ra ngoài canvas, mất chữ vô hình). */\nfunction fitTickLabel(scaleCtx, text, font) {\n  scaleCtx.save();\n  scaleCtx.font = font;\n  const maxW = HBAR_Y_WIDTH - 8;\n  if (scaleCtx.measureText(text).width <= maxW) { scaleCtx.restore(); return text; }\n  let s = text;\n  while (s.length > 1 && scaleCtx.measureText(s + '…').width > maxW) s = s.slice(0, -1);\n  scaleCtx.restore();\n  return s + '…';\n}\n\n/* Render x-axis + legend làm HTML tĩnh (không dùng Chart.js) — hết wasted space */\nconst HBAR_RIGHT_PAD = 20;  // matches body chart right padding + scrollbar allowance\n\nfunction niceStep(max, targetTicks) {\n  const rough = max / targetTicks;\n  const mag = Math.pow(10, Math.floor(Math.log10(rough)));\n  const norm = rough / mag;\n  const niceNorms = [1, 2, 2.5, 5, 10];\n  return (niceNorms.find(n => n >= norm) || 10) * mag;\n}\n\n/* Trục ngang dạng log — dùng khi tỷ trọng giữa các nhóm chênh nhau quá lớn\n   (ví dụ 17.500 Tấn vs 0,4 Tấn) khiến thang tuyến tính không đọc được */\nfunction renderHBarAxisLog(containerId, minX, maxX) {\n  const container = document.getElementById(containerId);\n  if (!container) return;\n  container.innerHTML = '';\n  const lo = Math.log10(minX), hi = Math.log10(maxX);\n  const ticks = [];\n  for (let e = Math.ceil(lo); e <= Math.floor(hi); e++) ticks.push(Math.pow(10, e));\n  if (!ticks.length) ticks.push(minX, maxX);\n\n  const xRow = document.createElement('div');\n  xRow.className = 'hbar-xaxis-row';\n  ticks.forEach(v => {\n    const tick = document.createElement('div');\n    tick.className = 'hbar-xaxis-tick';\n    const pos = (Math.log10(v) - lo) / (hi - lo);\n    tick.style.left = `calc(${HBAR_Y_WIDTH}px + (100% - ${HBAR_Y_WIDTH + HBAR_RIGHT_PAD}px) * ${pos})`;\n    tick.innerHTML = `<span class=\"tk-mark\"><\u002Fspan>${fmt(v)}`;\n    xRow.appendChild(tick);\n  });\n  container.appendChild(xRow);\n\n  const note = document.createElement('div');\n  note.className = 'hbar-legend-row';\n  note.innerHTML = `<span class=\"hbar-legend-item\" style=\"color:var(--muted); font-style:italic;\"><\u002Fspan>`;\n  container.appendChild(note);\n}\n\nfunction renderHBarAxis(containerId, maxX, datasets, showLegend) {\n  const container = document.getElementById(containerId);\n  if (!container) return;\n  container.innerHTML = '';\n\n  // X-axis row\n  const step = niceStep(maxX, 5);\n  const ticks = [];\n  for (let v = 0; v <= maxX + step * 0.001; v += step) ticks.push(v);\n\n  const xRow = document.createElement('div');\n  xRow.className = 'hbar-xaxis-row';\n  ticks.forEach(v => {\n    const tick = document.createElement('div');\n    tick.className = 'hbar-xaxis-tick';\n    tick.style.left = `calc(${HBAR_Y_WIDTH}px + (100% - ${HBAR_Y_WIDTH + HBAR_RIGHT_PAD}px) * ${v / maxX})`;\n    tick.innerHTML = `<span class=\"tk-mark\"><\u002Fspan>${fmt(v)}`;\n    xRow.appendChild(tick);\n  });\n  container.appendChild(xRow);\n\n  // Legend row (optional)\n  if (showLegend && datasets && datasets.length) {\n    const lg = document.createElement('div');\n    lg.className = 'hbar-legend-row';\n    datasets.forEach(ds => {\n      const item = document.createElement('span');\n      item.className = 'hbar-legend-item';\n      item.innerHTML = `<span class=\"hbar-legend-swatch\" style=\"background:${ds.backgroundColor}\"><\u002Fspan>${ds.label || ''}`;\n      lg.appendChild(item);\n    });\n    container.appendChild(lg);\n  }\n}\n\n/* Tính max value cho x-axis, làm tròn lên số đẹp để tick chia đều */\nfunction computeMaxX(datasets, stacked) {\n  if (!datasets.length) return 1;\n  let m = 0;\n  if (stacked) {\n    const n = datasets[0].data.length;\n    for (let i = 0; i < n; i++) {\n      const sum = datasets.reduce((s, ds) => s + (ds.data[i] || 0), 0);\n      if (sum > m) m = sum;\n    }\n  } else {\n    datasets.forEach(ds => ds.data.forEach(v => { if (v > m) m = v; }));\n  }\n  return niceMax(m);\n}\n\nfunction niceMax(v) {\n  if (v <= 0) return 1;\n  const buffered = v * 1.06;\n  const mag = Math.pow(10, Math.floor(Math.log10(buffered)));\n  const norm = buffered / mag;\n  const niceNorms = [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10];\n  const niceNorm = niceNorms.find(n => n >= norm) || 10;\n  return niceNorm * mag;\n}\n\n/* =============== POPULATE SLICERS =============== */\nconst PROJ_OPTIONS = (() => {\n  const m = new Map();\n  overviewData.forEach(r => m.set(r.proj, r.client));\n  exportData.forEach(r => { if (!m.has(r.proj)) m.set(r.proj, 'Xuất khẩu'); });\n  return [...m.entries()].sort((a, b) => a[0].localeCompare(b[0]));\n})();\ndocument.querySelectorAll('.proj-slicer').forEach(sel => {\n  PROJ_OPTIONS.forEach(([proj, client]) => {\n    sel.insertAdjacentHTML('beforeend', `<option value=\"${proj}\">${proj} — ${client}<\u002Foption>`);\n  });\n  sel.addEventListener('change', (e) => {\n    currentProject = e.target.value;\n    document.querySelectorAll('.proj-slicer').forEach(s => s.value = currentProject);\n    populateSubSlicers();\n    refreshAll();\n  });\n});\n\n/* Sub-slicer bindings (re-render tab riêng, không refreshAll) */\ndocument.getElementById('sup-slicer').addEventListener('change', (e) => {\n  currentSupplier = e.target.value; renderSupplier(); updateBadges();\n});\ndocument.getElementById('mpr-slicer').addEventListener('change', (e) => {\n  currentMprNo = e.target.value; renderMPR(); updateBadges();\n});\ndocument.getElementById('mat-slicer').addEventListener('change', (e) => {\n  currentMatKey = e.target.value; renderMat(); updateBadges();\n});\ndocument.getElementById('po-slicer').addEventListener('change', (e) => {\n  currentPoNo = e.target.value; renderPO(); updateBadges();\n});\n\n/* =============== OVERVIEW: KPIs =============== */\nfunction renderOverviewKPIs() {\n  const rows = filterByProj(overviewData);\n  const t = rows.reduce((a, r) => ({\n    po: a.po + r.po, mpr: a.mpr + r.mpr, pur: a.pur + r.pur,\n    arr: a.arr + r.arr, inv: a.inv + r.inv,\n  }), { po:0, mpr:0, pur:0, arr:0, inv:0 });\n  const bal = t.mpr - t.arr - t.inv;\n  const mprR = t.po ? (t.mpr / t.po * 100) : 0;\n  const purR = t.mpr ? ((t.pur + t.inv) / t.mpr * 100) : 0;\n  const arrR = t.mpr ? ((t.arr + t.inv) / t.mpr * 100) : 0;\n  const balR = t.mpr ? (bal / t.mpr * 100) : 0;\n\n  document.getElementById('ov-kpis').innerHTML = `\n    <div class=\"metric-card info-box info-primary\">\n      <div class=\"metric-label\">Tổng KL PO<\u002Fdiv>\n      <div><span class=\"metric-value\">${fmt(t.po)}<\u002Fspan><span class=\"metric-unit\">Tấn<\u002Fspan><\u002Fdiv>\n      <div class=\"metric-sub\">${rows.length} dự án đang theo dõi<\u002Fdiv>\n      <div class=\"info-box-icon\">📋<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"metric-card\">\n      <div class=\"metric-label\">KL MPR phát hành<\u002Fdiv>\n      <div><span class=\"metric-value\">${fmt(t.mpr)}<\u002Fspan><span class=\"metric-unit\">Tấn<\u002Fspan><\u002Fdiv>\n      <div class=\"metric-sub\"><span class=\"metric-badge badge-info\">${mprR.toFixed(2)}% / PO<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"metric-card\">\n      <div class=\"metric-label\">KL đã mua (Purchased)<\u002Fdiv>\n      <div><span class=\"metric-value\">${fmt(t.pur)}<\u002Fspan><span class=\"metric-unit\">Tấn<\u002Fspan><\u002Fdiv>\n      <div class=\"metric-sub\"><span class=\"metric-badge badge-info\">${purR.toFixed(2)}% / MPR<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"metric-card\">\n      <div class=\"metric-label\">KL đã về kho (Arrived)<\u002Fdiv>\n      <div><span class=\"metric-value\">${fmt(t.arr)}<\u002Fspan><span class=\"metric-unit\">Tấn<\u002Fspan><\u002Fdiv>\n      <div class=\"metric-sub\"><span class=\"metric-badge ${arrR>=98?'badge-success':arrR>=40?'badge-warning':'badge-danger'}\">${arrR.toFixed(2)}% / MPR<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"metric-card\">\n      <div class=\"metric-label\">Balance còn thiếu<\u002Fdiv>\n      <div><span class=\"metric-value\" style=\"color:var(--danger)\">${fmt(Math.max(0,bal))}<\u002Fspan><span class=\"metric-unit\">Tấn<\u002Fspan><\u002Fdiv>\n      <div class=\"metric-sub\"><span class=\"metric-badge badge-danger\">${Math.max(0,balR).toFixed(2)}% / MPR<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"metric-card\">\n      <div class=\"metric-label\">Tồn kho hiện tại<\u002Fdiv>\n      <div><span class=\"metric-value\">${fmt(t.inv)}<\u002Fspan><span class=\"metric-unit\">Tấn<\u002Fspan><\u002Fdiv>\n      <div class=\"metric-sub\">Inventory sẵn sàng cấp<\u002Fdiv>\n    <\u002Fdiv>\n  `;\n}\n\n/* =============== OVERVIEW: WATERFALL CHART =============== */\nlet waterfallChart = null;\n\nfunction computeWaterfall() {\n  const rows = filterByProj(overviewData);\n  const t = rows.reduce((a, r) => ({\n    mpr: a.mpr + r.mpr, pur: a.pur + r.pur,\n    arr: a.arr + r.arr, inv: a.inv + r.inv,\n  }), { mpr:0, pur:0, arr:0, inv:0 });\n  const bal = Math.max(0, t.mpr - t.arr - t.inv);\n  return { mpr: t.mpr, pur: t.pur, arr: t.arr, bal };\n}\n\n/*\n * Waterfall bar layout:\n * Bar 1 \"Total MPR\" — BLUE total, [0, mpr]\n * Bar 2 \"Purchased\" — ORANGE decrease, floating [pur, mpr]  (delta = mpr - pur)\n * Bar 3 \"Arrived\"   — ORANGE decrease, floating [arr, pur]  (delta = pur - arr)\n * Bar 4 \"Balance\"   — RED total, [0, bal]  (= mpr - arr - inv)\n */\nfunction buildWaterfall(t) {\n  return {\n    bars: [\n      { label: 'Total MPR', range: [0, t.mpr],   type: 'total',    value: t.mpr, color: '#0054a6' },\n      { label: 'Purchased', range: [t.pur, t.mpr], type: 'decrease', value: t.pur, color: '#f7a531', delta: t.mpr - t.pur },\n      { label: 'Arrived',   range: [t.arr, t.pur], type: 'decrease', value: t.arr, color: '#f7a531', delta: t.pur - t.arr },\n      { label: 'Balance',   range: [0, t.bal],   type: 'total',    value: t.bal, color: '#d63939' },\n    ]\n  };\n}\n\nconst waterfallLabelsPlugin = {\n  id: 'wfLabels',\n  afterDatasetsDraw(chart) {\n    const { ctx, scales: { y } } = chart;\n    const meta = chart.getDatasetMeta(0);\n    const bars = chart.$wfBars || [];\n    if (!meta || !meta.data) return;\n\n    ctx.save();\n    ctx.textAlign = 'center';\n\n    meta.data.forEach((bar, i) => {\n      const b = bars[i]; if (!b) return;\n      const topY = Math.min(y.getPixelForValue(b.range[0]), y.getPixelForValue(b.range[1]));\n      const btmY = Math.max(y.getPixelForValue(b.range[0]), y.getPixelForValue(b.range[1]));\n      const midY = (topY + btmY) / 2;\n\n      if (b.type === 'total') {\n        // Total bars (PO, Balance): show absolute value above bar\n        ctx.fillStyle = '#1d273b';\n        ctx.font = '700 12px -apple-system, sans-serif';\n        ctx.fillText(fmt(b.value), bar.x, topY - 6);\n      } else if (b.type === 'decrease' && b.delta > 0) {\n        // Decrease bars (Purchased, Arrived): show ONLY delta amount\n        const label = `−${fmt(b.delta)}`;\n        if ((btmY - topY) > 22) {\n          // Bar tall enough: put delta inside bar (white text)\n          ctx.fillStyle = '#fff';\n          ctx.font = '700 12px -apple-system, sans-serif';\n          ctx.fillText(label, bar.x, midY + 4);\n        } else {\n          // Bar too short: put delta above bar (dark text)\n          ctx.fillStyle = '#f7a531';\n          ctx.font = '700 12px -apple-system, sans-serif';\n          ctx.fillText(label, bar.x, topY - 6);\n        }\n      }\n    });\n\n    // Connector lines between adjacent bars (dashed)\n    ctx.strokeStyle = '#94a3b8';\n    ctx.setLineDash([3, 3]);\n    ctx.lineWidth = 1;\n    for (let i = 0; i < meta.data.length - 1; i++) {\n      const b1 = bars[i], b2 = bars[i+1];\n      if (!b1 || !b2) continue;\n      // connect top of bar[i] to top of bar[i+1] IF they share level (waterfall continuity)\n      const barA = meta.data[i], barB = meta.data[i+1];\n      // For our layout: bar[0].range[1] = po = bar[1].range[1]; bar[1].range[0] = pur = bar[2].range[1]\n      // Draw connector at top edge of bar[i]\n      const level = b1.range[1] === b2.range[1] ? b1.range[1] : (b1.range[0] === b2.range[1] ? b1.range[0] : null);\n      // Simpler: connect po→po (bar0 top to bar1 top) and pur→pur (bar1 bottom to bar2 top)\n      let yLevel;\n      if (i === 0) yLevel = y.getPixelForValue(b1.range[1]); // po\n      else if (i === 1) yLevel = y.getPixelForValue(b1.range[0]); // pur (bottom of bar1 = top of bar2)\n      else continue;\n      ctx.beginPath();\n      ctx.moveTo(barA.x + barA.width / 2, yLevel);\n      ctx.lineTo(barB.x - barB.width / 2, yLevel);\n      ctx.stroke();\n    }\n    ctx.setLineDash([]);\n    ctx.restore();\n  }\n};\n\nfunction renderWaterfall() {\n  const t = computeWaterfall();\n  const wf = buildWaterfall(t);\n\n  if (waterfallChart) waterfallChart.destroy();\n\n  const ctx = document.getElementById('chart-waterfall');\n  waterfallChart = new Chart(ctx, {\n    type: 'bar',\n    data: {\n      labels: wf.bars.map(b => b.label),\n      datasets: [{\n        label: 'Khối lượng (Tấn)',\n        data: wf.bars.map(b => b.range),\n        backgroundColor: wf.bars.map(b => b.color),\n        borderRadius: 4,\n        borderSkipped: false,\n        barPercentage: 0.6,\n        categoryPercentage: 0.85,\n      }]\n    },\n    options: {\n      responsive: true,\n      maintainAspectRatio: false,\n      layout: { padding: { top: 28 } },\n      plugins: {\n        legend: { display: false },\n        datalabels: { display: false },\n        tooltip: {\n          callbacks: {\n            label: (ctx) => {\n              const b = ctx.chart.$wfBars[ctx.dataIndex];\n              if (b.type === 'decrease') return [` Giá trị: ${fmt(b.value)} Tấn`, ` Giảm: −${fmt(b.delta)} Tấn`];\n              if (b.label === 'Balance') return [` Balance: ${fmt(b.value)} Tấn`, ` = MPR − Arrived − Inventory`];\n              return ` ${fmt(b.value)} Tấn`;\n            }\n          }\n        }\n      },\n      scales: {\n        y: {\n          beginAtZero: true,\n          title: { display: true, text: 'Tấn', font: { size: 13 } },\n          grid: { color: '#f1f5f9' },\n          ticks: { font: { size: 13 }, callback: (v) => fmt(v) }\n        },\n        x: {\n          grid: { display: false },\n          ticks: { font: { size: 14, weight: '600' } }\n        }\n      }\n    },\n    plugins: [waterfallLabelsPlugin]\n  });\n  waterfallChart.$wfBars = wf.bars;\n  waterfallChart.update();\n}\n\n/* =============== OVERVIEW: PURCHASED IMPORT vs DOMESTIC =============== */\nlet donutChart = null;\n\n// Plugin to draw labels outside the doughnut slices (weight value only)\nconst outsideLabelPlugin = {\n  id: 'outsideLabel',\n  afterDatasetsDraw(chart) {\n    const { ctx } = chart;\n    const meta = chart.getDatasetMeta(0);\n    if (!meta || !meta.data) return;\n\n    const total = chart.data.datasets[0].data.reduce((s, v) => s + v, 0);\n    if (!total) return;\n\n    ctx.save();\n    meta.data.forEach((arc, i) => {\n      const value = chart.data.datasets[0].data[i];\n      if (!value) return;\n      const label = chart.data.labels[i];\n      const color = chart.data.datasets[0].backgroundColor[i];\n\n      const { x, y, startAngle, endAngle, outerRadius } = arc.getProps(\n        ['x', 'y', 'startAngle', 'endAngle', 'outerRadius'], true\n      );\n      const midAngle = (startAngle + endAngle) / 2;\n\n      // Anchor point on the arc edge\n      const ax = x + Math.cos(midAngle) * outerRadius;\n      const ay = y + Math.sin(midAngle) * outerRadius;\n      // Bend point (short leader out)\n      const bx = x + Math.cos(midAngle) * (outerRadius + 12);\n      const by = y + Math.sin(midAngle) * (outerRadius + 12);\n      // Horizontal end\n      const isRight = Math.cos(midAngle) >= 0;\n      const ex = bx + (isRight ? 18 : -18);\n      const ey = by;\n\n      // Leader line\n      ctx.beginPath();\n      ctx.strokeStyle = color;\n      ctx.lineWidth = 1.2;\n      ctx.moveTo(ax, ay);\n      ctx.lineTo(bx, by);\n      ctx.lineTo(ex, ey);\n      ctx.stroke();\n\n      // Label text (value on top, name below)\n      ctx.textAlign = isRight ? 'left' : 'right';\n      ctx.textBaseline = 'middle';\n      const tx = ex + (isRight ? 4 : -4);\n\n      ctx.fillStyle = color;\n      ctx.font = '700 12px -apple-system, sans-serif';\n      ctx.fillText(`${fmt(value)} T`, tx, ey - 7);\n\n      ctx.fillStyle = '#6c757d';\n      ctx.font = '600 10px -apple-system, sans-serif';\n      ctx.fillText(label, tx, ey + 7);\n    });\n    ctx.restore();\n  }\n};\n\nfunction renderDonut() {\n  const rows = filterByProj(overviewData);\n  const t = rows.reduce((a, r) => ({\n    imp: a.imp + r.pur_imp,\n    dom: a.dom + r.pur_dom,\n  }), { imp:0, dom:0 });\n\n  if (donutChart) donutChart.destroy();\n  donutChart = new Chart(document.getElementById('chart-donut'), {\n    type: 'doughnut',\n    data: {\n      labels: ['Import', 'Domestic'],\n      datasets: [{\n        data: [t.imp, t.dom],\n        backgroundColor: ['#0054a6', '#2fb344'],\n        borderWidth: 2, borderColor: '#fff'\n      }]\n    },\n    options: {\n      responsive: true, maintainAspectRatio: false,\n      layout: { padding: 10 },\n      plugins: {\n        legend: { position: 'bottom', labels: { font: { size: 14 }, boxWidth: 14, padding: 8 } },\n        datalabels: {\n          color: '#fff', font: { size: 16, weight: '700' },\n          anchor: 'center', align: 'center',\n          formatter: (v) => v > 0 ? fmtC(v) : ''\n        },\n        tooltip: {\n          callbacks: {\n            label: (c) => {\n              const total = c.dataset.data.reduce((a,b)=>a+b, 0);\n              const pct = total ? (c.raw / total * 100).toFixed(2) : 0;\n              return ` ${c.label}: ${fmt(c.raw)} Tấn (${pct}%)`;\n            }\n          }\n        }\n      },\n      cutout: '58%'\n    }\n  });\n}\n\n/* =============== OVERVIEW: TABLE =============== */\nfunction renderOverviewTable() {\n  const rows = filterByProj(overviewData);\n  const tbody = document.getElementById('tbody-overview');\n  tbody.innerHTML = '';\n\n  if (rows.length === 0) {\n    tbody.innerHTML = `<tr><td colspan=\"15\" class=\"empty-state\">Không có dữ liệu.<\u002Ftd><\u002Ftr>`;\n    document.getElementById('ov-count-badge').textContent = '0 dòng';\n    return;\n  }\n\n  let sum = { po:0, po_c:0, po_a:0, mpr:0, pur:0, arr:0, inv:0 };\n  rows.forEach((r, i) => {\n    sum.po += r.po; sum.po_c += r.po_c; sum.po_a += r.po_a;\n    sum.mpr += r.mpr; sum.pur += r.pur; sum.arr += r.arr; sum.inv += r.inv;\n    const mprR = r.po ? (r.mpr / r.po * 100) : 0;\n    const purR = r.mpr ? ((r.pur + r.inv) / r.mpr * 100) : 0;\n    const arrR = r.mpr ? ((r.arr + r.inv) / r.mpr * 100) : 0;\n    const bal  = Math.max(0, r.mpr - r.arr - r.inv);\n    const balR = r.mpr ? (bal / r.mpr * 100) : 0;\n    tbody.insertAdjacentHTML('beforeend', `\n      <tr>\n        <td>${i+1}<\u002Ftd>\n        <td class=\"cell-project\">${r.proj}<\u002Ftd>\n        <td class=\"cell-muted\">${r.client}<\u002Ftd>\n        <td class=\"num\">${fmt(r.po)}<\u002Ftd>\n        <td class=\"num\">${fmt(r.po_c)}<\u002Ftd>\n        <td class=\"num\">${fmt(r.po_a)}<\u002Ftd>\n        <td class=\"num\">${fmt(r.mpr)}<\u002Ftd>\n        <td class=\"num\">${mprR.toFixed(2)}%<\u002Ftd>\n        <td class=\"num\">${fmt(r.pur)}<\u002Ftd>\n        <td class=\"num\">${purR.toFixed(2)}%<\u002Ftd>\n        <td class=\"num\">${fmt(r.arr)}<\u002Ftd>\n        <td class=\"num\">${pbar(arrR)}<\u002Ftd>\n        <td class=\"num\" style=\"color:var(--danger); font-weight:600\">${fmt(bal)}<\u002Ftd>\n        <td class=\"num\">${balR.toFixed(2)}%<\u002Ftd>\n        <td>${statusPill(arrR)}<\u002Ftd>\n      <\u002Ftr>\n    `);\n  });\n  const sBal  = Math.max(0, sum.mpr - sum.arr - sum.inv);\n  const sMprR = sum.po ? (sum.mpr / sum.po * 100) : 0;\n  const sPurR = sum.mpr ? ((sum.pur + sum.inv) / sum.mpr * 100) : 0;\n  const sArrR = sum.mpr ? ((sum.arr + sum.inv) / sum.mpr * 100) : 0;\n  const sBalR = sum.mpr ? (sBal / sum.mpr * 100) : 0;\n  tbody.insertAdjacentHTML('beforeend', `\n    <tr class=\"total-row\">\n      <td colspan=\"2\">TOTAL<\u002Ftd><td><\u002Ftd>\n      <td class=\"num\">${fmt(sum.po)}<\u002Ftd><td class=\"num\">${fmt(sum.po_c)}<\u002Ftd><td class=\"num\">${fmt(sum.po_a)}<\u002Ftd>\n      <td class=\"num\">${fmt(sum.mpr)}<\u002Ftd><td class=\"num\">${sMprR.toFixed(2)}%<\u002Ftd>\n      <td class=\"num\">${fmt(sum.pur)}<\u002Ftd><td class=\"num\">${sPurR.toFixed(2)}%<\u002Ftd>\n      <td class=\"num\">${fmt(sum.arr)}<\u002Ftd><td class=\"num\">${sArrR.toFixed(2)}%<\u002Ftd>\n      <td class=\"num\">${fmt(sBal)}<\u002Ftd><td class=\"num\">${sBalR.toFixed(2)}%<\u002Ftd>\n      <td><\u002Ftd>\n    <\u002Ftr>\n  `);\n  document.getElementById('ov-count-badge').textContent = `${rows.length} dòng`;\n}\n\n/* =============== MATERIAL STATUS: SUPPLIER =============== */\nlet supTopChart = null, supStatusChart = null;\n\nfunction renderSupplierCharts(rows) {\n  // Top by Balance (max 8)\n  const withBal = rows.map(r => ({\n    sup: r.sup,\n    balance: Math.max(0, r.mpr - r.arr - r.inv)\n  })).filter(r => r.balance > 0).sort((a,b) => b.balance - a.balance).slice(0, 8);\n\n  if (supTopChart) supTopChart.destroy();\n  setHBarHeight('chart-sup-top', Math.max(3, withBal.length));\n  const supTopDatasets = [{\n    label: 'Balance', data: withBal.map(r => r.balance),\n    backgroundColor: '#d63939', borderRadius: 4, barPercentage: 0.9, categoryPercentage: 0.85\n  }];\n  const supTopMax = computeMaxX(supTopDatasets, false);\n  renderHBarAxis('chart-sup-top-axis', supTopMax, supTopDatasets, false);\n\n  // Status buckets (3 mức: Đủ / Đang nhập / Rủi ro)\n  const buckets = statusBuckets(rows, r => r.mpr ? ((r.arr + r.inv) / r.mpr * 100) : 0);\n  if (supStatusChart) supStatusChart.destroy();\n  supStatusChart = statusDoughnut('chart-sup-status', buckets, 'NCC');\n\n  // Tạo hbar chart SAU CÙNG để Chart.js đọc đúng kích thước container sau khi grid đã kéo giãn hàng\n  supTopChart = new Chart(document.getElementById('chart-sup-top'), {\n    type: 'bar',\n    data: { labels: withBal.map(r => r.sup), datasets: supTopDatasets },\n    options: {\n      indexAxis: 'y', responsive: true, maintainAspectRatio: false,\n      plugins: {\n        legend: { display: false },\n        tooltip: { callbacks: { label: c => ` ${fmt(c.raw)} Tấn` } }\n      },\n      scales: {\n        x: { display: false, beginAtZero: true, max: supTopMax },\n        y: { grid: { display: false }, ticks: { font: { size: 14 }, callback: function(v) { return fitTickLabel(this.ctx, this.getLabelForValue(v), '14px -apple-system,sans-serif'); } }, afterFit: (ax) => { ax.width = HBAR_Y_WIDTH; } }\n      }\n    }\n  });\n}\n\nfunction renderSupplier() {\n  const rows = filterSupplier();\n  const tbody = document.getElementById('tbody-supplier');\n  tbody.innerHTML = '';\n\n  const uniqSup = new Set(rows.map(r => r.sup)).size;\n  let risk = 0;\n  const totKL = rows.reduce((a, r) => ({\n    mpr: a.mpr + r.mpr, pur: a.pur + r.pur, arr: a.arr + r.arr, inv: a.inv + r.inv\n  }), { mpr:0, pur:0, arr:0, inv:0 });\n  const totBal = Math.max(0, totKL.mpr - totKL.arr - totKL.inv);\n  rows.forEach(r => {\n    const arrR = r.mpr ? ((r.arr + r.inv) / r.mpr * 100) : 0;\n    if (matStatus(arrR, r.eta) === 'Rủi ro') risk++;\n  });\n  const arrPct = totKL.mpr ? ((totKL.arr + totKL.inv) / totKL.mpr * 100) : 0;\n\n  document.getElementById('sup-kpis').innerHTML = `\n    <div class=\"metric-card info-box info-primary\">\n      <div class=\"metric-label\">Tổng KL MPR<\u002Fdiv>\n      <div><span class=\"metric-value\">${fmt(totKL.mpr)}<\u002Fspan><span class=\"metric-unit\">Tấn<\u002Fspan><\u002Fdiv>\n      <div class=\"metric-sub\">Nhu cầu vật tư của nhánh NCC<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"metric-card\">\n      <div class=\"metric-label\">Số Nhà cung cấp<\u002Fdiv>\n      <div><span class=\"metric-value\">${uniqSup}<\u002Fspan><\u002Fdiv>\n      <div class=\"metric-sub\">Đang có giao dịch<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"metric-card\">\n      <div class=\"metric-label\">Arrived<\u002Fdiv>\n      <div><span class=\"metric-value\" style=\"color:var(--success)\">${fmt(totKL.arr)}<\u002Fspan><span class=\"metric-unit\">Tấn<\u002Fspan><\u002Fdiv>\n      <div class=\"metric-sub\">${arrPct.toFixed(2)}% so với MPR (gồm Inventory)<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"metric-card\">\n      <div class=\"metric-label\">Balance<\u002Fdiv>\n      <div><span class=\"metric-value\" style=\"color:var(--danger)\">${fmt(totBal)}<\u002Fspan><span class=\"metric-unit\">Tấn<\u002Fspan><\u002Fdiv>\n      <div class=\"metric-sub\">MPR − Arrived − Inventory<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"metric-card\">\n      <div class=\"metric-label\">NCC rủi ro<\u002Fdiv>\n      <div><span class=\"metric-value\" style=\"color:var(--danger)\">${risk}<\u002Fspan><\u002Fdiv>\n      <div class=\"metric-sub\">Chưa đủ 98% · ETA Update &lt; 15 ngày<\u002Fdiv>\n    <\u002Fdiv>\n  `;\n\n  if (rows.length === 0) {\n    tbody.innerHTML = `<tr><td colspan=\"12\" class=\"empty-state\">Không có dữ liệu.<\u002Ftd><\u002Ftr>`;\n    renderSupplierCharts(rows);\n    return;\n  }\n  rows.forEach((r, i) => {\n    const purR = r.mpr ? ((r.pur + r.inv) / r.mpr * 100) : 0;\n    const arrR = r.mpr ? ((r.arr + r.inv) / r.mpr * 100) : 0;\n    const bal = Math.max(0, r.mpr - r.arr - r.inv);\n    tbody.insertAdjacentHTML('beforeend', `\n      <tr>\n        <td>${i+1}<\u002Ftd>\n        <td class=\"cell-project\">${r.proj}<\u002Ftd>\n        <td>${r.sup}<\u002Ftd>\n        <td class=\"num\">${fmt(r.des)}<\u002Ftd>\n        <td class=\"num\">${fmt(r.mpr)}<\u002Ftd>\n        <td class=\"num\">${fmt(r.inv)}<\u002Ftd>\n        <td class=\"num\">${fmt(r.pur)}<\u002Ftd>\n        <td class=\"num\">${fmt(r.arr)}<\u002Ftd>\n        <td class=\"num\">${purR.toFixed(2)}%<\u002Ftd>\n        <td class=\"num\">${pbar(arrR)}<\u002Ftd>\n        <td class=\"num\" style=\"color:var(--danger); font-weight:600\">${fmt(bal)}<\u002Ftd>\n        <td>${statusPill(arrR, r.eta)}<\u002Ftd>\n      <\u002Ftr>\n    `);\n  });\n  renderSupplierCharts(rows);\n}\n\n/* =============== MATERIAL STATUS: MPR =============== */\nlet mprTopChart = null, mprStatusChart = null;\n\nfunction renderMPRCharts(rows) {\n  const withBal = rows.map(r => ({\n    mpr_no: r.mpr_no.replace('DCC26-', '').replace('-VTC', ''),\n    balance: Math.max(0, r.mpr_w - r.arr - r.inv)\n  })).filter(r => r.balance > 0).sort((a,b) => b.balance - a.balance).slice(0, 8);\n\n  if (mprTopChart) mprTopChart.destroy();\n  setHBarHeight('chart-mpr-top', Math.max(3, withBal.length));\n  const mprTopDatasets = [{ label: 'Balance', data: withBal.map(r => r.balance), backgroundColor: '#d63939', borderRadius: 4, barPercentage: 0.9, categoryPercentage: 0.85 }];\n  const mprTopMax = computeMaxX(mprTopDatasets, false);\n  renderHBarAxis('chart-mpr-top-axis', mprTopMax, mprTopDatasets, false);\n\n  // Status buckets (3 mức)\n  const buckets = statusBuckets(rows, r => r.mpr_w ? ((r.arr + r.inv) / r.mpr_w * 100) : 0);\n  if (mprStatusChart) mprStatusChart.destroy();\n  mprStatusChart = statusDoughnut('chart-mpr-status', buckets, 'MPR');\n\n  mprTopChart = new Chart(document.getElementById('chart-mpr-top'), {\n    type: 'bar',\n    data: { labels: withBal.map(r => r.mpr_no), datasets: mprTopDatasets },\n    options: {\n      indexAxis: 'y', responsive: true, maintainAspectRatio: false,\n      plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => ` ${fmt(c.raw)} Tấn` } } },\n      scales: {\n        x: { display: false, beginAtZero: true, max: mprTopMax },\n        y: { grid: { display: false }, ticks: { font: { size: 14, family: 'monospace' }, callback: function(v) { return fitTickLabel(this.ctx, this.getLabelForValue(v), '14px monospace'); } }, afterFit: (ax) => { ax.width = HBAR_Y_WIDTH; } }\n      }\n    }\n  });\n}\n\nfunction renderMPR() {\n  const rows = filterMPR();\n  const tbody = document.getElementById('tbody-mpr');\n  tbody.innerHTML = '';\n\n  let risk = 0;\n  const totKL = rows.reduce((a, r) => ({\n    mpr: a.mpr + r.mpr_w, pur: a.pur + r.pur, arr: a.arr + r.arr, inv: a.inv + r.inv\n  }), { mpr:0, pur:0, arr:0, inv:0 });\n  const totBal = Math.max(0, totKL.mpr - totKL.arr - totKL.inv);\n  rows.forEach(r => {\n    const arrR = r.mpr_w ? ((r.arr + r.inv) / r.mpr_w * 100) : 0;\n    if (matStatus(arrR, r.eta) === 'Rủi ro') risk++;\n  });\n  const arrPct = totKL.mpr ? ((totKL.arr + totKL.inv) / totKL.mpr * 100) : 0;\n\n  document.getElementById('mpr-kpis').innerHTML = `\n    <div class=\"metric-card info-box info-primary\">\n      <div class=\"metric-label\">Tổng KL MPR<\u002Fdiv>\n      <div><span class=\"metric-value\">${fmt(totKL.mpr)}<\u002Fspan><span class=\"metric-unit\">Tấn<\u002Fspan><\u002Fdiv>\n      <div class=\"metric-sub\">Nhu cầu vật tư của nhánh MPR<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"metric-card\">\n      <div class=\"metric-label\">Tổng số MPR<\u002Fdiv>\n      <div><span class=\"metric-value\">${rows.length}<\u002Fspan><\u002Fdiv>\n      <div class=\"metric-sub\">MPR duy nhất<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"metric-card\">\n      <div class=\"metric-label\">Arrived<\u002Fdiv>\n      <div><span class=\"metric-value\" style=\"color:var(--success)\">${fmt(totKL.arr)}<\u002Fspan><span class=\"metric-unit\">Tấn<\u002Fspan><\u002Fdiv>\n      <div class=\"metric-sub\">${arrPct.toFixed(2)}% so với MPR (gồm Inventory)<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"metric-card\">\n      <div class=\"metric-label\">Balance<\u002Fdiv>\n      <div><span class=\"metric-value\" style=\"color:var(--danger)\">${fmt(totBal)}<\u002Fspan><span class=\"metric-unit\">Tấn<\u002Fspan><\u002Fdiv>\n      <div class=\"metric-sub\">MPR − Arrived − Inventory<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"metric-card\">\n      <div class=\"metric-label\">MPR rủi ro<\u002Fdiv>\n      <div><span class=\"metric-value\" style=\"color:var(--danger)\">${risk}<\u002Fspan><\u002Fdiv>\n      <div class=\"metric-sub\">Chưa đủ 98% · ETA Update &lt; 15 ngày<\u002Fdiv>\n    <\u002Fdiv>\n  `;\n\n  if (rows.length === 0) {\n    tbody.innerHTML = `<tr><td colspan=\"12\" class=\"empty-state\">Không có dữ liệu.<\u002Ftd><\u002Ftr>`;\n    renderMPRCharts(rows);\n    return;\n  }\n  rows.forEach((r, i) => {\n    const purR = r.mpr_w ? ((r.pur + r.inv) / r.mpr_w * 100) : 0;\n    const arrR = r.mpr_w ? ((r.arr + r.inv) / r.mpr_w * 100) : 0;\n    const bal = Math.max(0, r.mpr_w - r.arr - r.inv);\n    tbody.insertAdjacentHTML('beforeend', `\n      <tr>\n        <td>${i+1}<\u002Ftd>\n        <td class=\"cell-project\">${r.proj}<\u002Ftd>\n        <td style=\"font-family:monospace; font-size:14px;\">${r.mpr_no}<\u002Ftd>\n        <td class=\"num\">${fmt(r.des)}<\u002Ftd>\n        <td class=\"num\">${fmt(r.mpr_w)}<\u002Ftd>\n        <td class=\"num\">${fmt(r.inv)}<\u002Ftd>\n        <td class=\"num\">${fmt(r.pur)}<\u002Ftd>\n        <td class=\"num\">${fmt(r.arr)}<\u002Ftd>\n        <td class=\"num\">${purR.toFixed(2)}%<\u002Ftd>\n        <td class=\"num\">${pbar(arrR)}<\u002Ftd>\n        <td class=\"num\" style=\"color:var(--danger); font-weight:600\">${fmt(bal)}<\u002Ftd>\n        <td>${statusPill(arrR, r.eta)}<\u002Ftd>\n      <\u002Ftr>\n    `);\n  });\n  renderMPRCharts(rows);\n}\n\n/* =============== MATERIAL STATUS: MATERIAL TYPE =============== */\nlet matTopChart = null, matStatusChart = null, matSourceChart = null;\n\nfunction renderMatCharts(rows) {\n  // Top 8 by MPR weight — KPI-fill style: Arrived (xanh, thực tế) + Balance (xám, còn thiếu) = MPR\n  const top = [...rows].sort((a,b) => b.mpr - a.mpr).slice(0, 8);\n\n  if (matTopChart) matTopChart.destroy();\n  setHBarHeight('chart-mat-top', Math.max(3, top.length));\n  const matTopDatasets = [\n    { label: 'Arrived (thực tế)',   data: top.map(r => r.arr),                       backgroundColor: '#2fb344', borderRadius: { topLeft: 3, bottomLeft: 3 }, stack: 'kpi', barPercentage: 0.9, categoryPercentage: 0.85 },\n    { label: 'Balance (còn thiếu)', data: top.map(r => Math.max(0, r.mpr - r.arr)),  backgroundColor: '#e2e8f0', borderRadius: { topRight: 3, bottomRight: 3 }, stack: 'kpi', barPercentage: 0.9, categoryPercentage: 0.85 },\n  ];\n  const matTopMax = computeMaxX(matTopDatasets, true);\n  renderHBarAxis('chart-mat-top-axis', matTopMax, matTopDatasets, true);\n\n  // Status buckets (3 mức)\n  const buckets = statusBuckets(rows, r => r.mpr ? (r.arr / r.mpr * 100) : 0);\n  if (matStatusChart) matStatusChart.destroy();\n  matStatusChart = statusDoughnut('chart-mat-status', buckets, 'nhóm VT');\n\n  // Ghi chú cơ cấu nguồn cung (Import / Domestic) — giữ lại thông tin cũ dưới dạng text\n  const impRows = rows.filter(r => r.usd > 0);\n  const domRows = rows.filter(r => r.vnd > 0);\n  const impWeight = impRows.reduce((s, r) => s + r.mpr, 0);\n  const domWeight = domRows.reduce((s, r) => s + r.mpr, 0);\n  const impUsd = impRows.reduce((s, r) => s + r.usd, 0);\n  const domVnd = domRows.reduce((s, r) => s + r.vnd, 0);\n  if (matSourceChart) matSourceChart.destroy();\n  matSourceChart = new Chart(document.getElementById('chart-mat-source'), {\n    type: 'doughnut',\n    data: {\n      labels: ['Import', 'Domestic'],\n      datasets: [{ data: [impWeight, domWeight], backgroundColor: ['#0054a6', '#2fb344'], borderWidth: 2, borderColor: '#fff' }]\n    },\n    options: {\n      responsive: true, maintainAspectRatio: false,\n      plugins: {\n        legend: { position: 'bottom', labels: { font: { size: 14 }, boxWidth: 14, padding: 8 } },\n        datalabels: { color: '#fff', font: { size: 16, weight: '700' }, anchor: 'center', align: 'center', formatter: v => v > 0 ? fmtC(v) : '' },\n        tooltip: {\n          callbacks: {\n            label: c => { const t = c.dataset.data.reduce((a, b) => a + b, 0); const pc = t ? (c.raw / t * 100).toFixed(2) : 0; return ` ${fmt(c.raw)} Tấn (${pc}%)`; },\n            afterLabel: c => c.dataIndex === 0 ? ` Giá trị: $${fmt(impUsd)}` : ` Giá trị: ${(domVnd/1e9).toFixed(2)} tỷ VND`\n          }\n        }\n      },\n      cutout: '58%'\n    }\n  });\n\n  const note = document.getElementById('mat-source-note');\n  if (note) note.innerHTML = `\n    // Tạo hbar chart SAU CÙNG (sau cả 2 doughnut) để Chart.js đọc đúng kích thước container sau khi grid đã kéo giãn hàng\n  matTopChart = new Chart(document.getElementById('chart-mat-top'), {\n    type: 'bar',\n    data: { labels: top.map(r => r.code), datasets: matTopDatasets },\n    options: {\n      indexAxis: 'y', responsive: true, maintainAspectRatio: false,\n      plugins: {\n        legend: { display: false },\n        datalabels: {\n          color: (ctx) => ctx.datasetIndex === 0 ? '#fff' : '#475569',\n          font: { size: 14, weight: '700' },\n          anchor: 'center', align: 'center',\n          formatter: (v) => v > 0 ? fmtC(v) : ''\n        },\n        tooltip: {\n          callbacks: {\n            label: c => {\n              const r = top[c.dataIndex];\n              const pct = r.mpr ? (r.arr / r.mpr * 100).toFixed(2) : 0;\n              if (c.datasetIndex === 0) return ` Arrived: ${fmt(c.raw)} Tấn (${pct}%)`;\n              return ` Balance: ${fmt(c.raw)} Tấn`;\n            },\n            afterBody: (items) => {\n              const idx = items[0].dataIndex;\n              return `\\nMPR: ${fmt(top[idx].mpr)} Tấn\\n${top[idx].desc}`;\n            }\n          }\n        }\n      },\n      scales: {\n        x: { display: false, stacked: true, beginAtZero: true, max: matTopMax },\n        y: { stacked: true, grid: { display: false }, ticks: { font: { size: 14, family: 'monospace' }, callback: function(v) { return fitTickLabel(this.ctx, this.getLabelForValue(v), '14px monospace'); } }, afterFit: (ax) => { ax.width = HBAR_Y_WIDTH; } }\n      }\n    }\n  });\n}\n\nfunction renderMat() {\n  const rows = filterMat();\n  const tbody = document.getElementById('tbody-mat');\n  tbody.innerHTML = '';\n\n  const totalUsd = rows.reduce((s, r) => s + r.usd, 0);\n  const totalVnd = rows.reduce((s, r) => s + r.vnd, 0);\n  const totKL = rows.reduce((a, r) => ({ mpr: a.mpr + r.mpr, arr: a.arr + r.arr }), { mpr:0, arr:0 });\n  const totBal = Math.max(0, totKL.mpr - totKL.arr);\n  const arrPct = totKL.mpr ? (totKL.arr / totKL.mpr * 100) : 0;\n\n  document.getElementById('mat-kpis').innerHTML = `\n    <div class=\"metric-card info-box info-primary\">\n      <div class=\"metric-label\">Tổng KL MPR<\u002Fdiv>\n      <div><span class=\"metric-value\">${fmt(totKL.mpr)}<\u002Fspan><span class=\"metric-unit\">Tấn<\u002Fspan><\u002Fdiv>\n      <div class=\"metric-sub\">Nhu cầu vật tư của nhánh Loại VT<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"metric-card\">\n      <div class=\"metric-label\">Số nhóm vật tư<\u002Fdiv>\n      <div><span class=\"metric-value\">${rows.length}<\u002Fspan><\u002Fdiv>\n      <div class=\"metric-sub\">Theo Code + Description<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"metric-card\">\n      <div class=\"metric-label\">Arrived<\u002Fdiv>\n      <div><span class=\"metric-value\" style=\"color:var(--success)\">${fmt(totKL.arr)}<\u002Fspan><span class=\"metric-unit\">Tấn<\u002Fspan><\u002Fdiv>\n      <div class=\"metric-sub\">${arrPct.toFixed(2)}% so với MPR<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"metric-card\">\n      <div class=\"metric-label\">Balance<\u002Fdiv>\n      <div><span class=\"metric-value\" style=\"color:var(--danger)\">${fmt(totBal)}<\u002Fspan><span class=\"metric-unit\">Tấn<\u002Fspan><\u002Fdiv>\n      <div class=\"metric-sub\">MPR − Arrived<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"metric-card info-box info-success\">\n      <div class=\"metric-label\">Tổng amount (VND)<\u002Fdiv>\n      <div><span class=\"metric-value\">${(totalVnd/1e9).toLocaleString('vi-VN', {minimumFractionDigits: 2, maximumFractionDigits: 2})}<\u002Fspan><span class=\"metric-unit\">tỷ VND<\u002Fspan><\u002Fdiv>\n      <div class=\"metric-sub\">Purchased Domestic · $${fmt(totalUsd)} Import<\u002Fdiv>\n    <\u002Fdiv>\n  `;\n\n  if (rows.length === 0) {\n    tbody.innerHTML = `<tr><td colspan=\"13\" class=\"empty-state\">Không có dữ liệu.<\u002Ftd><\u002Ftr>`;\n    renderMatCharts(rows);\n    return;\n  }\n  rows.forEach((r, i) => {\n    const arrR = r.mpr ? (r.arr / r.mpr * 100) : 0;\n    const bal = Math.max(0, r.mpr - r.arr);\n    const usdCell = r.usd > 0 ? `$${fmt(r.usd)}` : '<span class=\"cell-muted\">—<\u002Fspan>';\n    const vndCell = r.vnd > 0 ? `${(r.vnd/1e9).toFixed(2)} tỷ` : '<span class=\"cell-muted\">—<\u002Fspan>';\n    tbody.insertAdjacentHTML('beforeend', `\n      <tr>\n        <td>${i+1}<\u002Ftd>\n        <td class=\"cell-project\">${r.proj}<\u002Ftd>\n        <td style=\"font-family:monospace; font-size:14px;\">${r.code}<\u002Ftd>\n        <td>${r.desc}<\u002Ftd>\n        <td class=\"num\">${fmt(r.des)}<\u002Ftd>\n        <td class=\"num\">${fmt(r.mpr)}<\u002Ftd>\n        <td class=\"num\">${fmt(r.pur)}<\u002Ftd>\n        <td class=\"num\">${fmt(r.arr)}<\u002Ftd>\n        <td class=\"num\">${pbar(arrR)}<\u002Ftd>\n        <td class=\"num\" style=\"color:var(--danger); font-weight:600\">${fmt(bal)}<\u002Ftd>\n        <td class=\"num\">${usdCell}<\u002Ftd>\n        <td class=\"num\">${vndCell}<\u002Ftd>\n        <td>${statusPill(arrR, r.eta)}<\u002Ftd>\n      <\u002Ftr>\n    `);\n  });\n  renderMatCharts(rows);\n}\n\n/* =============== MATERIAL STATUS: PO =============== */\nlet poTopChart = null, poStatusChart = null;\n\nfunction renderPOCharts(rows) {\n  // Top 8 by Balance\n  const withBal = rows.map(r => ({\n    label: `${r.po_no.slice(-10)}·${r.sup.substring(0,10)}`,\n    balance: Math.max(0, r.mpr - r.arr - r.inv)\n  })).filter(r => r.balance > 0).sort((a,b) => b.balance - a.balance).slice(0, 8);\n\n  if (poTopChart) poTopChart.destroy();\n  setHBarHeight('chart-po-top', Math.max(3, withBal.length));\n  const poTopDatasets = [{ label: 'Balance', data: withBal.map(r => r.balance), backgroundColor: '#d63939', borderRadius: 4, barPercentage: 0.9, categoryPercentage: 0.85 }];\n  const poTopMax = computeMaxX(poTopDatasets, false);\n  renderHBarAxis('chart-po-top-axis', poTopMax, poTopDatasets, false);\n\n  // Status buckets (3 mức)\n  const buckets = statusBuckets(rows, r => r.mpr ? ((r.arr + r.inv) / r.mpr * 100) : 0);\n  if (poStatusChart) poStatusChart.destroy();\n  poStatusChart = statusDoughnut('chart-po-status', buckets, 'PO');\n\n  poTopChart = new Chart(document.getElementById('chart-po-top'), {\n    type: 'bar',\n    data: { labels: withBal.map(r => r.label), datasets: poTopDatasets },\n    options: {\n      indexAxis: 'y', responsive: true, maintainAspectRatio: false,\n      plugins: {\n        legend: { display: false },\n        datalabels: {\n          color: '#1d273b', font: { size: 14, weight: '700' },\n          anchor: 'end', align: 'right', offset: 4,\n          formatter: v => fmtC(v)\n        },\n        tooltip: { callbacks: { label: c => ` ${fmt(c.raw)} Tấn` } }\n      },\n      scales: {\n        x: { display: false, beginAtZero: true, max: poTopMax },\n        y: { grid: { display: false }, ticks: { font: { size: 14, family: 'monospace' }, callback: function(v) { return fitTickLabel(this.ctx, this.getLabelForValue(v), '14px monospace'); } }, afterFit: (ax) => { ax.width = HBAR_Y_WIDTH; } }\n      }\n    }\n  });\n}\n\nfunction renderPO() {\n  const rows = filterPO();\n  const tbody = document.getElementById('tbody-po');\n  tbody.innerHTML = '';\n\n  const totKL = rows.reduce((a, r) => ({\n    po_w: a.po_w + r.po_w, mpr: a.mpr + r.mpr, pur: a.pur + r.pur, arr: a.arr + r.arr, inv: a.inv + r.inv\n  }), { po_w:0, mpr:0, pur:0, arr:0, inv:0 });\n  const totBal = Math.max(0, totKL.mpr - totKL.arr - totKL.inv);\n\n  let risk = 0;\n  rows.forEach(r => {\n    const arrR = r.mpr ? ((r.arr + r.inv) / r.mpr * 100) : 0;\n    if (matStatus(arrR, r.eta) === 'Rủi ro') risk++;\n  });\n  const arrPct = totKL.mpr ? ((totKL.arr + totKL.inv) / totKL.mpr * 100) : 0;\n\n  document.getElementById('po-kpis').innerHTML = `\n    <div class=\"metric-card info-box info-primary\">\n      <div class=\"metric-label\">PO Weight<\u002Fdiv>\n      <div><span clas
