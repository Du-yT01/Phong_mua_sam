s=\"metric-value\">${fmt(totKL.po_w)}<\u002Fspan><span class=\"metric-unit\">Tấn<\u002Fspan><\u002Fdiv>\n      <div class=\"metric-sub\">Khối lượng đã đặt hàng<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"metric-card\">\n      <div class=\"metric-label\">Tổng số PO<\u002Fdiv>\n      <div><span class=\"metric-value\">${rows.length}<\u002Fspan><\u002Fdiv>\n      <div class=\"metric-sub\">PO đang tracking<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"metric-card\">\n      <div class=\"metric-label\">MPR<\u002Fdiv>\n      <div><span class=\"metric-value\" style=\"color:var(--info)\">${fmt(totKL.mpr)}<\u002Fspan><span class=\"metric-unit\">Tấn<\u002Fspan><\u002Fdiv>\n      <div class=\"metric-sub\">Nhu cầu gộp của các PO · Balance ${fmt(totBal)}<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"metric-card\">\n      <div class=\"metric-label\">Arrived<\u002Fdiv>\n      <div><span class=\"metric-value\" style=\"color:var(--success)\">${fmt(totKL.arr)}<\u002Fspan><span class=\"metric-unit\">Tấn<\u002Fspan><\u002Fdiv>\n      <div class=\"metric-sub\">${arrPct.toFixed(2)}% so với MPR (gồm Inventory)<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"metric-card\">\n      <div class=\"metric-label\">PO rủi ro<\u002Fdiv>\n      <div><span class=\"metric-value\" style=\"color:var(--danger)\">${risk}<\u002Fspan><\u002Fdiv>\n      <div class=\"metric-sub\">Chưa đủ 98% · ETA Update &lt; 15 ngày<\u002Fdiv>\n    <\u002Fdiv>\n  `;\n\n  if (rows.length === 0) {\n    tbody.innerHTML = `<tr><td colspan=\"13\" class=\"empty-state\">Không có dữ liệu.<\u002Ftd><\u002Ftr>`;\n    renderPOCharts(rows);\n    return;\n  }\n  rows.forEach((r, i) => {\n    const purR = r.mpr ? ((r.pur + r.inv) / r.mpr * 100) : 0;\n    const arrR = r.mpr ? ((r.arr + r.inv) / r.mpr * 100) : 0;\n    const bal = Math.max(0, r.mpr - r.arr - r.inv);\n    tbody.insertAdjacentHTML('beforeend', `\n      <tr>\n        <td>${i+1}<\u002Ftd>\n        <td class=\"cell-project\">${r.proj}<\u002Ftd>\n        <td style=\"font-family:monospace; font-size:13px;\">${r.po_no}<\u002Ftd>\n        <td class=\"cell-muted\">${r.sup}<\u002Ftd>\n        <td class=\"num\">${fmt(r.po_w)}<\u002Ftd>\n        <td class=\"num\">${fmt(r.mpr)}<\u002Ftd>\n        <td class=\"num\">${fmt(r.inv)}<\u002Ftd>\n        <td class=\"num\">${fmt(r.pur)}<\u002Ftd>\n        <td class=\"num\">${fmt(r.arr)}<\u002Ftd>\n        <td class=\"num\">${purR.toFixed(2)}%<\u002Ftd>\n        <td class=\"num\">${pbar(arrR)}<\u002Ftd>\n        <td class=\"num\" style=\"color:var(--danger); font-weight:600\">${fmt(bal)}<\u002Ftd>\n        <td>${statusPill(arrR, r.eta)}<\u002Ftd>\n      <\u002Ftr>\n    `);\n  });\n  renderPOCharts(rows);\n}\n\n/* ---- Bảng \"Chi tiết theo PO\" dùng chung cho cả 4 tab Material Status ---- */\nfunction renderPODetailTables() {\n  const rows = filterByProj(poData);\n  const html = rows.length === 0\n    ? `<tr><td colspan=\"9\" class=\"empty-state\">Không có dữ liệu.<\u002Ftd><\u002Ftr>`\n    : rows.map(r => {\n        const bal = Math.max(0, r.mpr - r.arr - r.inv);\n        const etaCell = r.eta ? fmtD(r.eta) : '<span class=\"cell-muted\">—<\u002Fspan>';\n        return `\n      <tr>\n        <td class=\"cell-project\">${r.proj}<\u002Ftd>\n        <td>${r.sup}<\u002Ftd>\n        <td style=\"font-family:monospace; font-size:14px;\">${r.po_no}<\u002Ftd>\n        <td style=\"font-size:14px;\">${etaCell}<\u002Ftd>\n        <td class=\"num\">${fmt(r.mpr)}<\u002Ftd>\n        <td class=\"num\">${fmt(r.inv)}<\u002Ftd>\n        <td class=\"num\">${fmt(r.pur)}<\u002Ftd>\n        <td class=\"num\" style=\"color:var(--success); font-weight:600;\">${fmt(r.arr)}<\u002Ftd>\n        <td class=\"num\" style=\"color:var(--danger); font-weight:600;\">${fmt(bal)}<\u002Ftd>\n      <\u002Ftr>`;\n      }).join('');\n  ['supplier', 'mpr', 'mat', 'po'].forEach(k => {\n    const tb = document.getElementById('tbody-detail-' + k);\n    if (tb) tb.innerHTML = html;\n  });\n}\n\n/* =============== LOGISTIC =============== */\nlet lgTransport = 'ALL';\n/* Bộ lọc thời gian của trang Logistic.\n   Nhập: so theo Plan ETA Update của shipment · Delivery: so theo ETD của lô */\nlet lgFrom = '', lgTo = '';\nfunction inDateRange(d) {\n  if (!lgFrom && !lgTo) return true;\n  if (!d) return false;\n  if (lgFrom && d < lgFrom) return false;\n  if (lgTo && d > lgTo) return false;\n  return true;\n}\nfunction filterLogistic() {\n  return logisticData.filter(r =>\n    (currentProject === 'ALL' || r.proj === currentProject) &&\n    (lgTransport === 'ALL' || r.transport === lgTransport) &&\n    inDateRange(etaUpdateOf(r))\n  );\n}\n\nlet lgTimelineChart = null, lgSupChart = null, lgDelayChart = null;\nlet exMonthChart = null, exProjChart = null, exItemChart = null, exTypeChart = null, exPolChart = null, exDlvChart = null;\nlet lgTableMode = 'in';\n\nfunction renderLogistic() {\n  const rows = filterLogistic();\n\n  // ----- Compute states -----\n  const totalQty = rows.reduce((s, r) => s + r.qty, 0);\n  const onBoat   = rows.filter(r => r.status === 'ON_BOAT').reduce((s, r) => s + r.qty, 0);\n  const atPort   = rows.filter(r => r.status === 'AT_PORT').reduce((s, r) => s + r.qty, 0);\n  const atAmecc  = rows.filter(r => r.status === 'AT_AMECC').reduce((s, r) => s + r.qty, 0);\n  const pending  = rows.filter(r => r.status === 'PENDING').reduce((s, r) => s + r.qty, 0);\n\n  // Overdue = chưa arrival && storage_due < TODAY\n  const overdue = rows.filter(r => !r.actual_arrival && r.storage_due !== '—' && daysTo(r.storage_due) < 0);\n  const overdueQty = overdue.reduce((s, r) => s + r.qty, 0);\n\n  // Arrival trong 7 ngày tới, chưa arrival\n  const soonArrival = rows.filter(r => !r.actual_arrival && daysTo(r.plan_arrival) !== null && daysTo(r.plan_arrival) >= 0 && daysTo(r.plan_arrival) <= 7);\n  const soonQty = soonArrival.reduce((s, r) => s + r.qty, 0);\n\n  // Storage sắp hết hạn (5 ngày tới, chưa arrival)\n  const storageSoon = rows.filter(r => !r.actual_arrival && r.storage_due !== '—' && daysTo(r.storage_due) !== null && daysTo(r.storage_due) >= 0 && daysTo(r.storage_due) <= 5);\n\n  // ----- KPI nhập: 5 chỉ số trên 1 hàng -----\n  document.getElementById('lg-kpis-pipeline').innerHTML = `\n    <div class=\"metric-card info-box info-primary\">\n      <div class=\"metric-label\">📥 Tổng KL nhập tracking<\u002Fdiv>\n      <div><span class=\"metric-value\">${fmt1(totalQty)}<\u002Fspan><span class=\"metric-unit\">Tấn<\u002Fspan><\u002Fdiv>\n      <div class=\"metric-sub\">${rows.length} shipment đang theo dõi<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"metric-card\">\n      <div class=\"metric-label\">✅ Đã về Amecc<\u002Fdiv>\n      <div><span class=\"metric-value\" style=\"color:var(--success)\">${fmt1(atAmecc)}<\u002Fspan><span class=\"metric-unit\">Tấn<\u002Fspan><\u002Fdiv>\n      <div class=\"metric-sub\">${rows.filter(r=>r.status==='AT_AMECC').length} shipment · Completed<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"metric-card info-box info-success\">\n      <div class=\"metric-label\">📊 Tỷ lệ đã về Amecc<\u002Fdiv>\n      <div><span class=\"metric-value\">${totalQty ? (atAmecc/totalQty*100).toFixed(2) : '0.00'}<\u002Fspan><span class=\"metric-unit\">%<\u002Fspan><\u002Fdiv>\n      <div class=\"metric-sub\">${fmt1(atAmecc)} / ${fmt1(totalQty)} Tấn<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"metric-card\" style=\"border-left:4px solid var(--danger);\">\n      <div class=\"metric-label\" style=\"color:var(--danger);\">🚨 Quá hạn storage<\u002Fdiv>\n      <div><span class=\"metric-value\" style=\"color:var(--danger)\">${overdue.length}<\u002Fspan><span class=\"metric-unit\">shipment<\u002Fspan><\u002Fdiv>\n      <div class=\"metric-sub\">${fmt1(overdueQty)} Tấn · Rủi ro phí lưu bãi<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"metric-card\" style=\"border-left:4px solid var(--warning);\">\n      <div class=\"metric-label\" style=\"color:var(--warning);\">⏰ Storage ≤ 5 ngày<\u002Fdiv>\n      <div><span class=\"metric-value\" style=\"color:var(--warning)\">${storageSoon.length}<\u002Fspan><span class=\"metric-unit\">shipment<\u002Fspan><\u002Fdiv>\n      <div class=\"metric-sub\">Sắp hết hạn — cần lấy hàng gấp<\u002Fdiv>\n    <\u002Fdiv>\n  `;\n\n  renderLogisticCharts(rows, { totalQty, onBoat, atPort, atAmecc, pending });\n  renderLogisticAlertTable(rows);\n  renderExport();\n}\n\n/* ---- Lô nhập bị chậm: so với Plan ETA Update (fallback plan_arrival) ---- */\nconst etaUpdateOf = r => r.eta_update || r.plan_arrival;\nfunction isLateShipment(r) {\n  const t = etaUpdateOf(r);\n  if (!t || t === '—') return false;\n  if (r.actual_arrival) return new Date(r.actual_arrival) > new Date(t);\n  return (daysTo(t) !== null && daysTo(t) < 0);\n}\n\nfunction renderLogisticCharts(rows, agg) {\n  // ===== CHART 1: Timeline 30 ngày tới =====\n  const timelineBuckets = [];\n  for (let i = 0; i < 30; i++) {\n    const d = new Date(TODAY.getTime() + i * DAY_MS);\n    timelineBuckets.push({ date: d, planQty: 0, overdueQty: 0 });\n  }\n  // Plan arrival trong 30 ngày\n  rows.forEach(r => {\n    if (r.actual_arrival) return;\n    const d = daysTo(r.plan_arrival);\n    if (d === null) return;\n    if (d >= 0 && d < 30) timelineBuckets[d].planQty += r.qty;\n  });\n  // Quá hạn: cộng dồn vào day 0\n  rows.forEach(r => {\n    if (r.actual_arrival) return;\n    const d = daysTo(r.plan_arrival);\n    if (d !== null && d < 0) timelineBuckets[0].overdueQty += r.qty;\n  });\n\n  if (lgTimelineChart) lgTimelineChart.destroy();\n  const timelineLabels = timelineBuckets.map(b => `${b.date.getDate()}/${b.date.getMonth()+1}`);\n  lgTimelineChart = new Chart(document.getElementById('chart-lg-timeline'), {\n    type:'bar',\n    data:{\n      labels: timelineLabels,\n      datasets:[\n        { label:'Quá hạn', data: timelineBuckets.map(b=>b.overdueQty), backgroundColor:'#d63939', stack:'s' },\n        { label:'Plan arrival', data: timelineBuckets.map(b=>b.planQty), backgroundColor:'#4299e1', stack:'s' },\n      ]\n    },\n    options:{\n      responsive:true, maintainAspectRatio:false,\n      plugins:{\n        legend:{position:'top', labels:{font:{size:13}, boxWidth:12, padding:8}},\n        datalabels: {\n          color: '#1d273b', font: { size: 13, weight: '700' },\n          anchor: 'end', align: 'end', offset: 2,\n          formatter: (v) => (v == null || v === 0) ? '' : fmtC(v),\n          display: (ctx) => ctx.dataset.data[ctx.dataIndex] >= 5  // hide small values in dense chart\n        },\n        tooltip:{ callbacks:{ label: c => ` ${c.dataset.label}: ${fmt1(c.raw)} Tấn` } }\n      },\n      scales:{\n        x:{stacked:true, grid:{display:false}, ticks:{font:{size:12}, maxRotation:0}},\n        y:{stacked:true, beginAtZero:true, ticks:{callback:v=>fmt(v), font:{size:12}}, grid:{color:'#f1f5f9'}, title:{display:true, text:'Tấn', font:{size:13}}}\n      }\n    }\n  });\n\n  // ===== CHART 2: Tổng Nhập theo NCC (đã về Amecc vs đang về) =====\n  const supMap = {};\n  rows.forEach(r => {\n    if (!supMap[r.sup]) supMap[r.sup] = { arrived: 0, intransit: 0 };\n    if (r.status === 'AT_AMECC') supMap[r.sup].arrived += r.qty;\n    else supMap[r.sup].intransit += r.qty;\n  });\n  const supTop = Object.entries(supMap)\n    .map(([k, v]) => ({ sup: k, ...v, total: v.arrived + v.intransit }))\n    .sort((a, b) => b.total - a.total).slice(0, 8);\n\n  if (lgSupChart) lgSupChart.destroy();\n  setHBarHeight('chart-lg-supplier', Math.max(3, supTop.length));\n  const lgSupDatasets = [\n    { label: 'Đã về Amecc', data: supTop.map(r => r.arrived),   backgroundColor: '#2fb344', borderRadius: { topLeft: 3, bottomLeft: 3 }, stack: 'in', barPercentage: 0.9, categoryPercentage: 0.85 },\n    { label: 'Đang về / chờ xuất', data: supTop.map(r => r.intransit), backgroundColor: '#cbd5e1', borderRadius: { topRight: 3, bottomRight: 3 }, stack: 'in', barPercentage: 0.9, categoryPercentage: 0.85 },\n  ];\n  const lgSupMax = computeMaxX(lgSupDatasets, true);\n  lgSupChart = new Chart(document.getElementById('chart-lg-supplier'), {\n    type: 'bar',\n    data: { labels: supTop.map(r => r.sup), datasets: lgSupDatasets },\n    options: {\n      indexAxis: 'y', responsive: true, maintainAspectRatio: false,\n      plugins: {\n        legend: { display: false },\n        datalabels: {\n          color: (c) => c.datasetIndex === 0 ? '#fff' : '#475569',\n          font: { size: 14, weight: '700' }, anchor: 'center', align: 'center',\n          formatter: (v) => v > 0 ? fmtC(v) : ''\n        },\n        tooltip: {\n          callbacks: {\n            label: c => ` ${c.dataset.label}: ${fmt1(c.raw)} Tấn`,\n            afterBody: (items) => `\\nTổng nhập: ${fmt1(supTop[items[0].dataIndex].total)} Tấn`\n          }\n        }\n      },\n      scales: {\n        x: { display: false, stacked: true, beginAtZero: true, max: lgSupMax },\n        y: { stacked: true, grid: { display: false }, ticks: { font: { size: 14 }, callback: function(v) { return fitTickLabel(this.ctx, this.getLabelForValue(v), '14px -apple-system,sans-serif'); } }, afterFit: (ax) => { ax.width = HBAR_Y_WIDTH; } }\n      }\n    }\n  });\n  renderHBarAxis('chart-lg-supplier-axis', lgSupMax, lgSupDatasets, true);\n\n  // ===== CHART 3: NCC có tỷ lệ giao chậm cao (so với Plan ETA Update) =====\n  const dlMap = {};\n  rows.forEach(r => {\n    if (!dlMap[r.sup]) dlMap[r.sup] = { late: 0, total: 0 };\n    dlMap[r.sup].total++;\n    if (isLateShipment(r)) dlMap[r.sup].late++;\n  });\n  const dlTop = Object.entries(dlMap)\n    .map(([k, v]) => ({ sup: k, ...v, pct: v.total ? v.late / v.total * 100 : 0 }))\n    .filter(r => r.late > 0)\n    .sort((a, b) => b.pct - a.pct || b.late - a.late).slice(0, 8);\n\n  if (lgDelayChart) lgDelayChart.destroy();\n  setHBarHeight('chart-lg-delay', Math.max(3, dlTop.length));\n  capHBarRowToShorter('chart-lg-supplier', 'chart-lg-delay');\n  const lgDelayDatasets = [{\n    label: '% lô trễ',\n    data: dlTop.map(r => Number(r.pct.toFixed(2))),\n    backgroundColor: dlTop.map(r => r.pct >= 50 ? '#d63939' : (r.pct >= 25 ? '#f7a531' : '#4299e1')),\n    borderRadius: 4, barPercentage: 0.9, categoryPercentage: 0.85\n  }];\n  lgDelayChart = new Chart(document.getElementById('chart-lg-delay'), {\n    type: 'bar',\n    data: { labels: dlTop.map(r => r.sup), datasets: lgDelayDatasets },\n    options: {\n      indexAxis: 'y', responsive: true, maintainAspectRatio: false,\n      plugins: {\n        legend: { display: false },\n        datalabels: {\n          color: '#1d273b', font: { size: 14, weight: '700' },\n          anchor: 'end', align: 'right', offset: 4,\n          formatter: (v) => v > 0 ? v.toFixed(2) + '%' : ''\n        },\n        tooltip: {\n          callbacks: {\n            label: c => ` ${c.raw.toFixed(2)}% trễ`,\n            afterBody: (items) => {\n              const r = dlTop[items[0].dataIndex];\n              return `\\n${r.late}/${r.total} lô trễ so với Plan ETA Update`;\n            }\n          }\n        }\n      },\n      scales: {\n        x: { display: false, beginAtZero: true, max: 100 },\n        y: { grid: { display: false }, ticks: { font: { size: 14 }, callback: function(v) { return fitTickLabel(this.ctx, this.getLabelForValue(v), '14px -apple-system,sans-serif'); } }, afterFit: (ax) => { ax.width = HBAR_Y_WIDTH; } }\n      }\n    }\n  });\n  renderHBarAxis('chart-lg-delay-axis', 100, lgDelayDatasets, false);\n}\n\nfunction renderLogisticAlertTable(rows) {\n  const tbody = document.getElementById('tbody-lg-alert');\n  tbody.innerHTML = '';\n\n  // Priority score: quá hạn = 1000-days_overdue; sắp về ≤7 = 100+urgency; storage due ≤5 = 200+urgency\n  const scored = rows.filter(r => !r.actual_arrival).map(r => {\n    const dueDays = daysTo(r.storage_due);\n    const arrDays = daysTo(r.plan_arrival);\n    let score = 0, tag = '';\n    if (dueDays !== null && dueDays < 0) { score = 1000 + Math.abs(dueDays); tag = 'OVERDUE_STORAGE'; }\n    else if (arrDays !== null && arrDays >= 0 && arrDays <= 7) { score = 500 - arrDays; tag = 'SOON_ARRIVAL'; }\n    else if (dueDays !== null && dueDays >= 0 && dueDays <= 5) { score = 300 - dueDays; tag = 'STORAGE_SOON'; }\n    return { ...r, _score: score, _tag: tag };\n  }).filter(r => r._score > 0).sort((a,b) => b._score - a._score).slice(0, 15);\n\n  if (scored.length === 0) {\n    tbody.innerHTML = `<tr><td colspan=\"13\" class=\"empty-state\">✅ Không có shipment cần chú ý.<\u002Ftd><\u002Ftr>`;\n    return;\n  }\n\n  const transportIcon = { SEA:'🚢 SEA', AIR:'✈️ AIR', TRUCK:'🚚 TRUCK' };\n  const statusPillLg = (r) => {\n    if (r._tag === 'OVERDUE_STORAGE') return `<span class=\"status-pill badge-danger\">🚨 Quá hạn<\u002Fspan>`;\n    if (r._tag === 'SOON_ARRIVAL') return `<span class=\"status-pill badge-success\">🔔 Sắp về<\u002Fspan>`;\n    if (r._tag === 'STORAGE_SOON') return `<span class=\"status-pill badge-warning\">⏰ Sắp hạn<\u002Fspan>`;\n    return `<span class=\"status-pill badge-info\">${r.status}<\u002Fspan>`;\n  };\n  const daysDisplay = (r) => {\n    if (r._tag === 'OVERDUE_STORAGE') {\n      const d = daysTo(r.storage_due);\n      return `<span style=\"color:var(--danger); font-weight:700;\">-${Math.abs(d)}d<\u002Fspan>`;\n    }\n    if (r._tag === 'SOON_ARRIVAL') {\n      const d = daysTo(r.plan_arrival);\n      return `<span style=\"color:var(--success); font-weight:600;\">${d}d<\u002Fspan>`;\n    }\n    if (r._tag === 'STORAGE_SOON') {\n      const d = daysTo(r.storage_due);\n      return `<span style=\"color:var(--warning); font-weight:600;\">${d}d<\u002Fspan>`;\n    }\n    return '—';\n  };\n\n  scored.forEach((r, i) => {\n    tbody.insertAdjacentHTML('beforeend', `\n      <tr>\n        <td>${i+1}<\u002Ftd>\n        <td class=\"cell-project\">${r.proj}<\u002Ftd>\n        <td class=\"cell-muted\">${r.sup}<\u002Ftd>\n        <td style=\"font-family:monospace; font-size:13px;\">${r.po}<\u002Ftd>\n        <td style=\"font-family:monospace; font-size:13px;\">${r.bill}<\u002Ftd>\n        <td class=\"num\">${fmt1(r.qty)}<\u002Ftd>\n        <td>${transportIcon[r.transport] || r.transport}<\u002Ftd>\n        <td style=\"font-size:14px;\">${fmtD(r.etd)}<\u002Ftd>\n        <td style=\"font-size:14px;\">${fmtD(r.eta)}<\u002Ftd>\n        <td style=\"font-size:14px;\">${fmtD(r.storage_due)}<\u002Ftd>\n        <td style=\"font-size:14px;\">${fmtD(etaUpdateOf(r))}${isLateShipment(r) ? ' <span style=\"color:var(--danger);font-weight:700;\">⚠<\u002Fspan>' : ''}<\u002Ftd>\n        <td>${statusPillLg(r)}<\u002Ftd>\n        <td class=\"num\">${daysDisplay(r)}<\u002Ftd>\n      <\u002Ftr>\n    `);\n  });\n}\n\n/* =============== XUẤT NVL =============== */\nconst MODE_GROUP = { FCL: 'SEA', LCL: 'SEA', BV: 'SEA', AIR: 'AIR', XETAI: 'TRUCK' };\nconst EX_ST_COLORS = { 'Hoàn tất': '#2fb344', 'Đang thực hiện': '#4299e1', 'Muộn': '#d63939' };\nconst EX_ST_ORDER  = ['Hoàn tất', 'Đang thực hiện', 'Muộn'];\n\n/* ---- KHỐI LƯỢNG LÔ XUẤT ----\n * Chỉ lấy đúng số cân thực tế ở cột Q'ty GW (kg) của file nguồn, KHÔNG suy luận/quy đổi.\n * Lô chưa có GW (phần lớn hàng FCL) được tính KL = 0 và đếm riêng ở card\n * \"Lô chưa có số cân GW\" để biết phạm vi dữ liệu còn thiếu.\n * ---------------------------- */\nconst exTon   = r => (r.gw || 0) / 1000;\nconst exNoGW  = r => !r.gw;\n\n/* Trạng thái lô giao hàng — \"muộn\" xác định bằng ETD:\n   Status = DONE → Hoàn tất; chưa DONE mà ETD đã qua → Muộn; còn lại → Đang thực hiện */\nfunction exStatus(r) {\n  if (r.st === 'DONE') return 'Hoàn tất';\n  if (r.etd && daysTo(r.etd) !== null && daysTo(r.etd) < 0) return 'Muộn';\n  return 'Đang thực hiện';\n}\n\nfunction filterExport() {\n  return exportData.filter(r =>\n    (currentProject === 'ALL' || r.proj === currentProject) &&\n    (lgTransport === 'ALL' || MODE_GROUP[r.mode] === lgTransport) &&\n    inDateRange(r.etd)\n  );\n}\nconst monthKey = d => d ? d.slice(0, 7) : '';\n\nfunction renderExport() {\n  const rows = filterExport();\n  const tonAll    = rows.reduce((a, r) => a + exTon(r), 0);\n  const totCtr    = rows.reduce((a, r) => a + (r.qty || 0), 0);\n  const withGW    = rows.filter(r => r.gw);\n  const shipped   = rows.filter(r => r.etd && daysTo(r.etd) !== null && daysTo(r.etd) <= 0);\n  const tonShip   = shipped.reduce((a, r) => a + exTon(r), 0);\n  const lateRows  = rows.filter(r => exStatus(r) === 'Muộn');\n  const tonLate   = lateRows.reduce((a, r) => a + exTon(r), 0);\n  const doneRows  = rows.filter(r => exStatus(r) === 'Hoàn tất');\n  const tonDone   = doneRows.reduce((a, r) => a + exTon(r), 0);\n  const donePct   = tonAll ? (tonDone / tonAll * 100) : 0;\n\n  document.getElementById('ex-kpis').innerHTML = `\n    <div class=\"metric-card info-box info-primary\">\n      <div class=\"metric-label\">Tổng KL xuất<\u002Fdiv>\n      <div><span class=\"metric-value\">${fmt1(tonAll)}<\u002Fspan><span class=\"metric-unit\">Tấn<\u002Fspan><\u002Fdiv>\n      <div class=\"metric-sub\">Số cân GW của ${withGW.length}/${rows.length} lô<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"metric-card\">\n      <div class=\"metric-label\">Tổng container<\u002Fdiv>\n      <div><span class=\"metric-value\" style=\"color:var(--info)\">${fmt(totCtr)}<\u002Fspan><span class=\"metric-unit\">CTR<\u002Fspan><\u002Fdiv>\n      <div class=\"metric-sub\">${rows.filter(r => (r.qty || 0) > 0).length} lô đi container<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"metric-card\">\n      <div class=\"metric-label\">Đã xuất (qua ETD)<\u002Fdiv>\n      <div><span class=\"metric-value\" style=\"color:var(--success)\">${fmt1(tonShip)}<\u002Fspan><span class=\"metric-unit\">Tấn<\u002Fspan><\u002Fdiv>\n      <div class=\"metric-sub\">${shipped.length} lô đã rời cảng<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"metric-card\" style=\"border-left:4px solid var(--danger);\">\n      <div class=\"metric-label\" style=\"color:var(--danger);\">🚨 KL đang muộn<\u002Fdiv>\n      <div><span class=\"metric-value\" style=\"color:var(--danger)\">${fmt1(tonLate)}<\u002Fspan><span class=\"metric-unit\">Tấn<\u002Fspan><\u002Fdiv>\n      <div class=\"metric-sub\">${lateRows.length} lô đã quá ETD mà Status chưa DONE<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"metric-card info-box info-success\">\n      <div class=\"metric-label\">Tỷ lệ hoàn tất (theo KL)<\u002Fdiv>\n      <div><span class=\"metric-value\">${donePct.toFixed(2)}<\u002Fspan><span class=\"metric-unit\">%<\u002Fspan><\u002Fdiv>\n      <div class=\"metric-sub\">${fmt1(tonDone)} / ${fmt1(tonAll)} Tấn đã DONE<\u002Fdiv>\n    <\u002Fdiv>\n  `;\n\n  renderExportCharts(rows);\n  renderExportTable(rows);\n}\n\n/* Gom nhóm theo 1 chiều bất kỳ → { key, ton, ctr, lot } đã sort giảm dần theo Tấn */\nfunction exGroup(rows, keyFn, emptyLabel) {\n  const m = {};\n  rows.forEach(r => {\n    const k = keyFn(r) || emptyLabel;\n    if (!m[k]) m[k] = { ton: 0, ctr: 0, lot: 0, nogw: 0 };\n    m[k].ton += exTon(r); m[k].ctr += (r.qty || 0); m[k].lot++;\n    if (exNoGW(r)) m[k].nogw++;\n  });\n  return Object.entries(m).map(([key, v]) => ({ key, ...v })).sort((a, b) => b.ton - a.ton);\n}\n\n/* Hbar 1 dataset theo Tấn — dùng chung cho Item of goods / POL */\nfunction exHBar(canvasId, axisId, data, monospace, forceCount) {\n  setHBarHeight(canvasId, Math.max(3, forceCount || data.length));\n  const total = data.reduce((a, r) => a + r.ton, 0);\n  const ds = [{\n    label: 'Tấn', data: data.map(r => r.ton),\n    backgroundColor: data.map((r, i) => i === 0 ? '#0054a6' : (r.ton / (total || 1) < 0.02 ? '#94a3b8' : '#4299e1')),\n    borderRadius: 4, barPercentage: 0.9, categoryPercentage: 0.85,\n    minBarLength: 6   // nhóm chiếm tỷ trọng rất nhỏ vẫn hiện được thanh để đọc nhãn\n  }];\n  // Chênh lệch giữa nhóm lớn nhất và nhỏ nhất > 100 lần → dùng thang log cho dễ đọc\n  const vals   = data.map(r => r.ton).filter(v => v > 0);\n  const vMax   = Math.max(...vals, 1), vMin = Math.min(...vals, vMax);\n  const useLog = vals.length > 1 && vMax / vMin > 100;\n  const logMin = Math.pow(10, Math.floor(Math.log10(vMin)));\n  const logMax = Math.pow(10, Math.ceil(Math.log10(vMax)));\n  const max = useLog ? logMax : computeMaxX(ds, false);\n  if (useLog) ds[0].minBarLength = 0;\n  const chart = new Chart(document.getElementById(canvasId), {\n    type: 'bar',\n    data: { labels: data.map(r => r.key), datasets: ds },\n    options: {\n      indexAxis: 'y', responsive: true, maintainAspectRatio: false,\n      plugins: {\n        legend: { display: false },\n        datalabels: {\n          color: '#1d273b', font: { size: 14, weight: '700' }, anchor: 'end', align: 'right', offset: 4,\n          formatter: (v) => v > 0 ? `${fmtC(v)}  (${(v / (total || 1) * 100).toFixed(1)}%)` : ''\n        },\n        tooltip: {\n          callbacks: {\n            label: c => ` ${fmt1(c.raw)} Tấn (${(c.raw / (total || 1) * 100).toFixed(2)}%)`,\n            afterBody: (items) => {\n              const r = data[items[0].dataIndex];\n              return `\\n${r.lot} lô · ${fmt(r.ctr)} container` + (r.nogw ? `\\n${r.nogw} lô chưa có GW (không tính vào KL)` : '');\n            }\n          }\n        }\n      },\n      scales: {\n        x: useLog\n          ? { display: false, type: 'logarithmic', min: logMin, max: logMax }\n          : { display: false, beginAtZero: true, max },\n        y: { grid: { display: false }, ticks: { font: { size: 14, family: monospace ? 'monospace' : undefined }, callback: function(v) { return fitTickLabel(this.ctx, this.getLabelForValue(v), monospace ? '14px monospace' : '14px -apple-system,sans-serif'); } }, afterFit: (ax) => { ax.width = HBAR_Y_WIDTH; } }\n      }\n    }\n  });\n  if (useLog) renderHBarAxisLog(axisId, logMin, logMax);\n  else renderHBarAxis(axisId, max, ds, false);\n  return chart;\n}\n\n/* Doughnut theo Tấn — dùng chung cho Export type / Delivery term */\nfunction exDoughnut(canvasId, data, palette) {\n  return new Chart(document.getElementById(canvasId), {\n    type: 'doughnut',\n    data: { labels: data.map(r => r.key), datasets: [{ data: data.map(r => r.ton), backgroundColor: palette, borderWidth: 2, borderColor: '#fff' }] },\n    options: {\n      responsive: true, maintainAspectRatio: false,\n      plugins: {\n        legend: { position: 'bottom', labels: { font: { size: 13 }, boxWidth: 12, padding: 6 } },\n        datalabels: {\n          color: '#fff', font: { size: 14, weight: '700' }, anchor: 'center', align: 'center',\n          formatter: (v, ctx) => {\n            const t = ctx.dataset.data.reduce((a, b) => a + b, 0);\n            return (t && v / t >= 0.04) ? fmtC(v) : '';   // lát quá nhỏ thì bỏ nhãn, xem ở tooltip\n          }\n        },\n        tooltip: {\n          callbacks: {\n            label: c => { const t = c.dataset.data.reduce((a, b) => a + b, 0); const pc = t ? (c.raw / t * 100).toFixed(2) : 0; return ` ${fmt1(c.raw)} Tấn (${pc}%)`; },\n            afterLabel: c => ` ${data[c.dataIndex].lot} lô · ${fmt(data[c.dataIndex].ctr)} CTR` + (data[c.dataIndex].nogw ? ` · ${data[c.dataIndex].nogw} lô chưa có GW` : '')\n          }\n        }\n      },\n      cutout: '55%'\n    }\n  });\n}\n\nconst EX_PALETTE = ['#0054a6', '#2fb344', '#f7a531', '#4299e1', '#d63939', '#7c3aed', '#94a3b8', '#0ea5e9'];\n\nfunction renderExportCharts(rows) {\n  // ===== CHART 1: KL xuất theo tháng (ETD) + số container =====\n  const months  = [...new Set(rows.map(r => monthKey(r.etd)).filter(Boolean))].sort();\n  const tonByM  = months.map(m => rows.filter(r => monthKey(r.etd) === m).reduce((a, r) => a + exTon(r), 0));\n  const ctrByM  = months.map(m => rows.filter(r => monthKey(r.etd) === m).reduce((a, r) => a + (r.qty || 0), 0));\n  const mLabel  = months.map(m => { const [y, mm] = m.split('-'); return `T${Number(mm)}/${y.slice(2)}`; });\n\n  if (exMonthChart) exMonthChart.destroy();\n  exMonthChart = new Chart(document.getElementById('chart-ex-month'), {\n    data: {\n      labels: mLabel,\n      datasets: [\n        { type: 'bar',  label: 'Khối lượng (GW)', data: tonByM, backgroundColor: '#0054a6', borderRadius: { topLeft: 3, topRight: 3 }, yAxisID: 'y', order: 2 },\n        { type: 'line', label: 'Số container', data: ctrByM, borderColor: '#f7a531', backgroundColor: '#f7a531',\n          borderWidth: 3, tension: 0.3, pointRadius: 4, yAxisID: 'y1', order: 1 },\n      ]\n    },\n    options: {\n      responsive: true, maintainAspectRatio: false,\n      plugins: {\n        legend: { position: 'top', labels: { font: { size: 13 }, boxWidth: 12, padding: 6 } },\n        datalabels: {\n          color: (c) => c.dataset.type === 'line' ? '#b45309' : '#1d273b',\n          font: { size: 13, weight: '700' },\n          anchor: 'end',\n          align: 'top', offset: 2,\n          formatter: (v, c) => c.dataset.type === 'line' ? (v > 0 ? v : '') : (v >= 100 ? fmtC(v) : '')\n        },\n        tooltip: { callbacks: { label: c => c.dataset.type === 'line' ? ` ${c.dataset.label}: ${fmt(c.raw)} CTR` : ` ${c.dataset.label}: ${fmt1(c.raw)} Tấn` } }\n      },\n      scales: {\n        x: { grid: { display: false }, ticks: { font: { size: 13 } } },\n        y:  { beginAtZero: true, position: 'left', grid: { color: '#f1f5f9' }, ticks: { callback: v => fmtC(v), font: { size: 12 } }, title: { display: true, text: 'Tấn', font: { size: 13 } } },\n        y1: { beginAtZero: true, position: 'right', grid: { display: false }, ticks: { font: { size: 12 } }, title: { display: true, text: 'CTR', font: { size: 13 } } }\n      }\n    }\n  });\n\n  // ===== CHART 2: KL theo dự án × trạng thái =====\n  const pMap = {};\n  rows.forEach(r => {\n    if (!pMap[r.proj]) pMap[r.proj] = { 'Hoàn tất': 0, 'Đang thực hiện': 0, 'Muộn': 0, ton: 0, ctr: 0, lot: 0, nogw: 0 };\n    const t = exTon(r);\n    pMap[r.proj][exStatus(r)] += t;\n    pMap[r.proj].ton += t; pMap[r.proj].ctr += (r.qty || 0); pMap[r.proj].lot++;\n    if (exNoGW(r)) pMap[r.proj].nogw++;\n  });\n  const pTop = Object.entries(pMap).map(([k, v]) => ({ proj: k, ...v }))\n    .filter(r => r.ton > 0).sort((a, b) => b.ton - a.ton).slice(0, 10);\n\n  if (exProjChart) exProjChart.destroy();\n  setHBarHeight('chart-ex-proj', Math.max(3, pTop.length));\n  {\n    const w = document.getElementById('chart-ex-proj').parentElement.parentElement;\n    w.style.maxHeight = '300px'; w.style.overflowY = 'auto';\n  }\n  const exProjDatasets = EX_ST_ORDER.map((k, i) => ({\n    label: k, data: pTop.map(r => r[k]), backgroundColor: EX_ST_COLORS[k], stack: 'st',\n    borderRadius: i === 0 ? { topLeft: 3, bottomLeft: 3 } : (i === EX_ST_ORDER.length - 1 ? { topRight: 3, bottomRight: 3 } : 0),\n    barPercentage: 0.9, categoryPercentage: 0.85\n  }));\n  const exProjMax = computeMaxX(exProjDatasets, true);\n  exProjChart = new Chart(document.getElementById('chart-ex-proj'), {\n    type: 'bar',\n    data: { labels: pTop.map(r => r.proj), datasets: exProjDatasets },\n    options: {\n      indexAxis: 'y', responsive: true, maintainAspectRatio: false,\n      plugins: {\n        legend: { display: false },\n        datalabels: { color: '#fff', font: { size: 14, weight: '700' }, anchor: 'center', align: 'center', formatter: v => v > 0 ? fmtC(v) : '' },\n        tooltip: {\n          callbacks: {\n            label: c => ` ${c.dataset.label}: ${fmt1(c.raw)} Tấn`,\n            afterBody: (items) => {\n              const r = pTop[items[0].dataIndex];\n              return `\\nTổng ${fmt1(r.ton)} Tấn · ${fmt(r.ctr)} CTR · ${r.lot} lô` + (r.nogw ? `\\n${r.nogw} lô chưa có GW (không tính vào KL)` : '');\n            }\n          }\n        }\n      },\n      scales: {\n        x: { display: false, stacked: true, beginAtZero: true, max: exProjMax },\n        y: { stacked: true, grid: { display: false }, ticks: { font: { size: 14, family: 'monospace' }, callback: function(v) { return fitTickLabel(this.ctx, this.getLabelForValue(v), '14px monospace'); } }, afterFit: (ax) => { ax.width = HBAR_Y_WIDTH; } }\n      }\n    }\n  });\n  renderHBarAxis('chart-ex-proj-axis', exProjMax, exProjDatasets, true);\n\n  // ===== CHART 3: Cơ cấu nguyên vật liệu (Item of goods) =====\n  if (exItemChart) exItemChart.destroy();\n  const exItemData = exGroup(rows, r => r.item, '(Chưa phân loại)').filter(r => r.ton > 0).slice(0, 8);\n  const exTypeDataForCount = exGroup(rows, r => r.et, '(Trống)').filter(r => r.ton > 0).slice(0, 8);\n  const exItemPairCount = Math.max(exItemData.length, exTypeDataForCount.length);\n  exItemChart = exHBar('chart-ex-item', 'chart-ex-item-axis', exItemData, false, exItemPairCount);\n\n  // ===== CHART 4: Export type =====\n  if (exTypeChart) exTypeChart.destroy();\n  exTypeChart = exHBar('chart-ex-type', 'chart-ex-type-axis', exTypeDataForCount, true, exItemPairCount);\n\n  // ===== CHART 6: Điều kiện giao hàng (Delivery term) =====\n  if (exDlvChart) exDlvChart.destroy();\n  exDlvChart = exDoughnut('chart-ex-dlv', exGroup(rows, r => r.dlv, '(Trống)').filter(r => r.ton > 0).slice(0, 8), EX_PALETTE);\n\n  // ===== CHART 5: Cảng xuất (POL) — cap theo chiều cao cố định của chart-ex-dlv, cuộn nếu nhiều dòng =====\n  if (exPolChart) exPolChart.destroy();\n  exPolChart = exHBar('chart-ex-pol', 'chart-ex-pol-axis', exGroup(rows, r => r.pol, '(Chưa có POL)').filter(r => r.ton > 0).slice(0, 8), false);\n  {\n    const w = document.getElementById('chart-ex-pol').parentElement.parentElement;\n    w.style.maxHeight = '300px'; w.style.overflowY = 'auto';\n  }\n}\n\nfunction renderExportTable(rows) {\n  const tbody = document.getElementById('tbody-ex-detail');\n  if (!tbody) return;\n  tbody.innerHTML = '';\n  const sorted = [...rows].sort((a, b) => (b.etd || '').localeCompare(a.etd || ''));\n  if (sorted.length === 0) {\n    tbody.innerHTML = `<tr><td colspan=\"19\" class=\"empty-state\">Không có dữ liệu xuất.<\u002Ftd><\u002Ftr>`;\n    return;\n  }\n  const modeIcon = { FCL: '🚢 FCL', LCL: '🚢 LCL', BV: '🚢 BV', AIR: '✈️ AIR', XETAI: '🚚 Xe tải' };\n  const coPill = (v) => {\n    if (v === 'xong')  return `<span class=\"status-pill badge-success\">Xong<\u002Fspan>`;\n    if (v === 'nháp')  return `<span class=\"status-pill badge-warning\">Nháp<\u002Fspan>`;\n    if (v === 'chưa')  return `<span class=\"status-pill badge-danger\">Chưa<\u002Fspan>`;\n    if (v === 'không') return `<span class=\"status-pill badge-info\">Không<\u002Fspan>`;\n    return '<span class=\"cell-muted\">—<\u002Fspan>';\n  };\n  const stPill = (r) => {\n    const st = exStatus(r);\n    const cls = st === 'Hoàn tất' ? 'badge-success' : (st === 'Muộn' ? 'badge-danger' : 'badge-info');\n    const d = r.etd ? daysTo(r.etd) : null;\n    const hint = (st === 'Muộn' && d !== null) ? ` title=\"Quá ETD ${fmtD(r.etd)} ${Math.abs(d)} ngày mà chưa DONE\"` : '';\n    return `<span class=\"status-pill ${cls}\"${hint}>${st}<\u002Fspan>`;\n  };\n  sorted.forEach((r) => {\n    const shipped = r.etd && daysTo(r.etd) !== null && daysTo(r.etd) <= 0;\n    const cdsCell = r.cds\n      ? `<span style=\"font-family:monospace; font-size:13px;\">${r.cds}<\u002Fspan>`\n      : (shipped ? `<span class=\"status-pill badge-danger\">Thiếu<\u002Fspan>` : '<span class=\"cell-muted\">—<\u002Fspan>');\n    tbody.insertAdjacentHTML('beforeend', `\n      <tr>\n        <td>${r.no}<\u002Ftd>\n        <td class=\"cell-project\">${r.proj}<\u002Ftd>\n        <td style=\"font-family:monospace; font-size:14px;\">${r.et}<\u002Ftd>\n        <td>${r.item || '<span class=\"cell-muted\">—<\u002Fspan>'}<\u002Ftd>\n        <td style=\"font-size:14px;\">${modeIcon[r.mode] || r.mode || '—'}<\u002Ftd>\n        <td style=\"font-size:14px; font-weight:600;\">${r.dlv || '<span class=\"cell-muted\">—<\u002Fspan>'}<\u002Ftd>\n        <td style=\"font-size:14px;\">${r.ctr || '<span class=\"cell-muted\">—<\u002Fspan>'}<\u002Ftd>\n        <td class=\"num\">${r.qty ? fmt(r.qty) : '<span class=\"cell-muted\">—<\u002Fspan>'}<\u002Ftd>\n        <td class=\"num\">${r.gw ? fmt1(exTon(r)) : '<span class=\"cell-muted\">chưa có GW<\u002Fspan>'}<\u002Ftd>\n        <td style=\"font-size:14px;\">${r.vessel || '<span class=\"cell-muted\">—<\u002Fspan>'}<\u002Ftd>\n        <td class=\"cell-muted\">${r.carrier || '—'}<\u002Ftd>\n        <td style=\"font-family:monospace; font-size:13px;\">${r.bill || '<span class=\"cell-muted\">—<\u002Fspan>'}<\u002Ftd>\n        <td style=\"font-size:14px;\">${r.pol || '<span class=\"cell-muted\">—<\u002Fspan>'}<\u002Ftd>\n        <td style=\"font-size:14px;\">${r.pod || '<span class=\"cell-muted\">—<\u002Fspan>'}<\u002Ftd>\n        <td style=\"font-size:14px;\">${fmtD(r.etd)}<\u002Ftd>\n        <td style=\"font-size:14px;\">${fmtD(r.eta)}<\u002Ftd>\n        <td>${cdsCell}<\u002Ftd>\n        <td>${coPill(r.co)}<\u002Ftd>\n        <td>${stPill(r)}<\u002Ftd>\n      <\u002Ftr>\n    `);\n  });\n  const foot = document.getElementById('ex-tbl-foot');\n  if (foot) foot.innerHTML = `<span>Hiển thị <b>${sorted.length}<\u002Fb> lô xuất — cuộn trong bảng để xem tiếp<\u002Fspan><span>Cuộn ngang để xem đủ cột<\u002Fspan>`;\n}\n\n/* ---- Toggle bảng chi tiết Nhập / Xuất ---- */\ndocument.querySelectorAll('.tbl-toggle button').forEach(btn => {\n  btn.addEventListener('click', () => {\n    document.querySelectorAll('.tbl-toggle button').forEach(b => b.classList.remove('active'));\n    btn.classList.add('active');\n    lgTableMode = btn.dataset.tbl;\n    const isIn = lgTableMode === 'in';\n    document.getElementById('tblwrap-in').style.display  = isIn ? '' : 'none';\n    document.getElementById('tblwrap-out').style.display = isIn ? 'none' : '';\n    document.getElementById('ex-tbl-foot').style.display = isIn ? 'none' : 'flex';\n    document.getElementById('lg-tbl-title').innerHTML = isIn\n      ? '🚨 Chi tiết Nhập — Shipment cần chú ý (Top 15)'\n      : '📤 Chi tiết Delivery — Danh sách lô giao hàng';\n    document.getElementById('lg-tbl-sub').innerHTML = isIn\n      ? 'Ưu tiên: quá hạn storage → sắp về Amecc (≤7 ngày) → sắp quá hạn storage (≤5 ngày)'\n      : 'Sắp xếp theo ETD mới nhất · KL chỉ hiển thị khi lô đã có số cân GW trong file nguồn · cuộn dọc/ngang trong bảng';\n  });\n});\n\n/* =============== FILTER BADGES =============== */\nfunction updateBadges() {\n  const chip = currentProject === 'ALL'\n    ? `<span class=\"filter-chip\">Tất cả dự án<\u002Fspan>`\n    : `<span class=\"filter-chip\">🎯 ${currentProject}<\u002Fspan>`;\n  document.getElementById('ov-filter-badge').innerHTML = `Đang xem: ${chip}`;\n\n  // Material Status badge — include active sub-slicer chip\n  const activeTab = document.querySelector('.sub-tab.active')?.dataset.tab || 'supplier';\n  let subChip = '', count = 0;\n  if (activeTab === 'supplier') {\n    count = filterSupplier().length;\n    if (currentSupplier !== 'ALL') subChip = `<span class=\"filter-chip\">🏭 ${currentSupplier}<\u002Fspan>`;\n  } else if (activeTab === 'mpr') {\n    count = filterMPR().length;\n    if (currentMprNo !== 'ALL') subChip = `<span class=\"filter-chip\">📄 ${currentMprNo}<\u002Fspan>`;\n  } else if (activeTab === 'mat') {\n    count = filterMat().length;\n    if (currentMatKey !== 'ALL') subChip = `<span class=\"filter-chip\">🔩 ${currentMatKey.split('|')[0]}<\u002Fspan>`;\n  } else if (activeTab === 'po') {\n    count = filterPO().length;\n    if (currentPoNo !== 'ALL') subChip = `<span class=\"filter-chip\">📋 ${currentPoNo.substring(0,20)}${currentPoNo.length>20?'…':''}<\u002Fspan>`;\n  }\n  document.getElementById('st-filter-badge').innerHTML = `Đang xem: ${chip} ${subChip} <b>${count}<\u002Fb> dòng`;\n\n  const lgChip = lgTransport === 'ALL' ? '' : `<span class=\"filter-chip\">${lgTransport}<\u002Fspan>`;\n  const dateChip = (lgFrom || lgTo) ? `<span class=\"filter-chip\">📅 ${lgFrom || '…'} → ${lgTo || '…'}<\u002Fspan>` : '';\n  document.getElementById('lg-filter-badge').innerHTML = `Đang xem: ${chip} ${lgChip} ${dateChip}`;\n}\n\n/* =============== REFRESH ALL =============== */\nfunction refreshAll() {\n  updateBadges();\n  renderOverviewKPIs();\n  renderWaterfall();\n  renderDonut();\n  renderOverviewTable();\n  renderSupplier();\n  renderMPR();\n  renderMat();\n  renderPO();\n  renderPODetailTables();\n  renderLogistic();\n}\n\n/* =============== LOGISTIC DATE FILTER BIND =============== */\n['lg-date-from', 'lg-date-to'].forEach(id => {\n  document.getElementById(id).addEventListener('change', () => {\n    lgFrom = document.getElementById('lg-date-from').value;\n    lgTo   = document.getElementById('lg-date-to').value;\n    updateBadges();\n    renderLogistic();\n  });\n});\n/* =============== LOGISTIC SLICER BIND =============== */\n\n/* =============== NAV =============== */\ndocument.querySelectorAll('.nav-page').forEach(el => {\n  el.addEventListener('click', () => {\n    document.querySelectorAll('.nav-page').forEach(x => x.classList.remove('active'));\n    el.classList.add('active');\n    const target = el.dataset.page;\n    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));\n    document.getElementById('page-' + target).classList.add('active');\n    window.scrollTo({ top: 0, behavior: 'smooth' });\n    if (target === 'overview') { renderOverviewKPIs(); renderWaterfall(); renderDonut(); renderOverviewTable(); }\n    else if (target === 'status') {\n      const activeTab = document.querySelector('.sub-tab.active');\n      const t = activeTab ? activeTab.dataset.tab : 'supplier';\n      if (t === 'supplier') renderSupplier();\n      else if (t === 'mpr') renderMPR();\n      else if (t === 'mat') renderMat();\n      else if (t === 'po') renderPO();\n    }\n    else if (target === 'logistic') { renderLogistic(); }\n  });\n});\n\n// TOC click → scroll to section\ndocument.querySelectorAll('.guide-toc li').forEach(li => {\n  li.addEventListener('click', () => {\n    const target = document.getElementById(li.dataset.goto);\n    if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });\n  });\n});\n\ndocument.querySelectorAll('.sub-tab').forEach(el => {\n  el.addEventListener('click', () => {\n    document.querySelectorAll('.sub-tab').forEach(x => x.classList.remove('active'));\n    el.classList.add('active');\n    const target = el.dataset.tab;\n    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));\n    document.getElementById('tab-' + target).classList.add('active');\n    // Show only the sub-slicer of active tab\n    document.querySelectorAll('.sub-slicer').forEach(g => {\n      g.style.display = (g.dataset.for === target) ? 'flex' : 'none';\n    });\n    updateBadges();\n    if (target === 'supplier') renderSupplier();\n    else if (target === 'mpr') renderMPR();\n    else if (target === 'mat') renderMat();\n    else if (target === 'po') renderPO();\n  });\n});\n\n/* Initial render */\npopulateSubSlicers();\nrefreshAll();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
